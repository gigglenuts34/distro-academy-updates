/* Distro Academy Pocket: the phone companion.
   Daily challenge, flashcards, quick quizzes and friends, signed in with the same account as the desktop app.
   XP earned here is posted to your account as "pocket" activity; the desktop app collects it (and keeps your streak). */
(function () {
  const { esc, hash, today, addDays } = DA;
  const $ = s => document.querySelector(s);
  const app = $("#app");
  const CFG = DA.ONLINE_CONFIG || {};
  const TUX = `<img src="tux.svg" alt="">`;

  // ---------- local state ----------
  const KEY = "da-pocket-v1";
  const blank = () => ({ xp: 0, days: {}, daily: {}, cards: {}, pending: {}, session: null, theme: "auto", distro: "cachyos", name: "" });
  let S;
  try { S = { ...blank(), ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch { S = blank(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* private mode: still works for this visit */ } };
  const applyTheme = () => { if (S.theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = S.theme; };
  applyTheme();

  const toast = msg => { document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
  const buzz = ms => { try { navigator.vibrate?.(ms); } catch { /* no vibration */ } };

  // XP: kept locally, queued for the desktop app.
  const earn = (n, why, extra = {}) => {
    const d = today();
    S.xp += n; S.days[d] = (S.days[d] || 0) + n;
    const p = S.pending[d] = S.pending[d] || { xp: 0 };
    p.xp += n; Object.assign(p, extra);
    save(); toast(`+${n} XP · ${why}`); flushSoon();
  };

  // ---------- online (same server and accounts as the desktop app) ----------
  const emailFor = u => `${u.toLowerCase()}@users.distro-academy.invalid`;
  const signedIn = () => !!S.session?.access_token;
  async function req(method, path, body, { auth = true, headers = {} } = {}) {
    if (auth) await fresh();
    const h = { apikey: CFG.key, Authorization: `Bearer ${auth && S.session?.access_token ? S.session.access_token : CFG.key}`, ...headers };
    if (body !== undefined) h["Content-Type"] = "application/json";
    let r;
    try { r = await fetch(CFG.url + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) }); }
    catch { throw new Error("Can't reach the server. Check your connection."); }
    const text = await r.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!r.ok) {
      const m = data?.msg || data?.message || data?.error_description || data?.error || `Server error ${r.status}`;
      throw Object.assign(new Error(/invalid login/i.test(m) ? "Wrong username or password." : m), { status: r.status });
    }
    return data;
  }
  const keep = d => { S.session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000, id: d.user.id, username: d.user.user_metadata?.username || "" }; save(); };
  let refreshing = null;
  async function fresh() {
    const s = S.session; if (!s?.refresh_token || s.expires_at - Date.now() > 60000) return;
    refreshing = refreshing || (async () => {
      try { keep(await req("POST", "/auth/v1/token?grant_type=refresh_token", { refresh_token: s.refresh_token }, { auth: false })); }
      catch (e) { if (e.status === 400 || e.status === 401) { S.session = null; save(); } }
      finally { refreshing = null; }
    })();
    return refreshing;
  }
  const logIn = async (u, pw) => { keep(await req("POST", "/auth/v1/token?grant_type=password", { email: emailFor(u.trim()), password: pw }, { auth: false })); me = null; flush(); };
  const logOut = async () => { try { await req("POST", "/auth/v1/logout", {}); } catch { /* already gone */ } S.session = null; me = null; save(); };

  // Send queued XP to the account (the desktop app picks it up within a couple of minutes).
  let flushing = false, flushTimer = null;
  const flushSoon = () => { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1500); };
  async function flush() {
    if (!signedIn() || flushing) return;
    flushing = true;
    try {
      for (const [day, p] of Object.entries(S.pending)) {
        if (!p.xp && !p.daily) { delete S.pending[day]; continue; }
        await req("POST", "/rest/v1/activity", { kind: "pocket", detail: { day, xp: Math.min(500, p.xp | 0), ...(p.daily ? { daily: String(p.daily).slice(0, 200) } : {}) } }, { headers: { Prefer: "return=minimal" } });
        delete S.pending[day]; save();
      }
    } catch { /* offline: try again later */ }
    flushing = false;
  }
  window.addEventListener("online", flush);

  let me = null; // my profile (stats synced by the desktop app)
  const myProfile = async () => { if (!signedIn()) return null; if (me) return me; try { [me] = await req("GET", `/rest/v1/profiles?select=id,username,display_name,avatar,stats&id=eq.${S.session.id}`); } catch { me = null; } return me; };
  const nameOf = p => p?.display_name || p?.username || "friend";
  const avatar = a => !a || a === "tux" ? TUX : esc(a);

  // ---------- content ----------
  const distro = () => DA.DISTROS.find(d => d.id === S.distro) || DA.DISTROS.find(d => d.id === "cachyos") || DA.DISTROS[0];
  const daily = () => DA.DAILY[hash("daily" + today()) % DA.DAILY.length]; // same challenge as the desktop app
  const cotd = () => DA.COTD[hash("cotd" + today()) % DA.COTD.length];
  const lessonQs = () => {
    const d = distro(), out = [];
    for (const l of [...DA.CORE, ...(DA.CORE2 || []), ...(DA.CORE3 || [])]) { try { (l.quiz?.(d) || []).forEach(q => out.push({ ...q, from: l.title })); } catch { /* skip */ } }
    return out;
  };
  const certQs = () => DA.CERTPREP.flatMap(b => b.qs.map(q => ({ ...q, from: b.name })));
  const DECKS = {
    cmds: { name: "Commands", em: "⌨️", cards: () => DA.COTD.map(([n, ex, what]) => ({ id: "c:" + n, front: n, mono: true, back: what, ex })) },
    terms: { name: "Linux words", em: "📖", cards: () => DA.GLOSSARY.map(([t, def]) => ({ id: "g:" + t, front: t, back: def })) }
  };
  const BOX_DAYS = [0, 1, 3, 7, 16, 35];
  const due = deck => DECKS[deck].cards().filter(c => { const s = S.cards[c.id]; return !s || s.due <= today(); });

  // ---------- views ----------
  const TABS = [["today", "🏠", "Today"], ["cards", "🃏", "Cards"], ["quiz", "❓", "Quiz"], ["friends", "👥", "Friends"], ["me", "🐧", "Me"]];
  let tab = "today";
  const go = t => { const h = t === "today" ? "" : t; if (location.hash.slice(1) === h) { tab = t; render(); } else location.hash = h; window.scrollTo(0, 0); };
  const tabs = () => { $("#tabs").innerHTML = TABS.map(([k, em, l]) => `<button data-tab="${k}" class="${k === tab ? "on" : ""}" aria-current="${k === tab ? "page" : "false"}"><span class="em">${em}</span>${l}</button>`).join(""); };
  $("#tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); };

  const V = {};

  V.today = async () => {
    const c = daily(), done = S.daily[today()], [cn, cex, cwhat] = cotd();
    const hello = S.name || S.session?.username || "";
    app.innerHTML = `<div class="page">
      <div class="head">${TUX}<div><div class="eyebrow">// ${new Date().toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" })}</div><h1>${hello ? `Hey ${esc(hello)}` : "Distro Academy Pocket"}</h1></div></div>
      <div id="me-stats"></div>
      <section class="card"><div class="row spread"><h2>⚡ Daily challenge</h2>${done ? `<span class="tag mint">Solved</span>` : `<span class="tag butter">+30 XP</span>`}</div>
        <p>${esc(c.t)}</p>
        ${done ? `<div class="callout good">Your answer: <code>${esc(done)}</code>. A new one tomorrow.</div>` : `
        <form id="dc" class="term"><span>$</span><input id="dc-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the command" aria-label="Your command"></form>
        <div id="dc-out"></div>
        <div class="btns"><button class="btn" id="dc-hint">💡 Hint</button><button class="btn primary" id="dc-go">Check</button></div>`}
      </section>
      <section class="card"><div class="row spread"><h2>🧰 Command of the day</h2><span class="tag">${esc(cn)}</span></div><p class="muted">${esc(cwhat)}</p><div class="term"><span>$</span><code style="background:none;padding:0;color:inherit">${esc(cex)}</code></div></section>
      <div class="btns"><button class="btn soft" data-go="cards">🃏 ${due("cmds").length + due("terms").length} cards due</button><button class="btn soft" data-go="quiz">❓ Quick quiz</button></div>
      <p class="tiny faint" style="text-align:center">${S.days[today()] ? `${S.days[today()]} XP earned on your phone today` : "Earn XP here and it counts on your desktop too"}${signedIn() ? "" : " · sign in on the Me tab to sync it"}</p>
    </div>`;
    app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
    if (!done) {
      const check = e => {
        e?.preventDefault();
        const cmd = $("#dc-in").value.trim().replace(/\s+/g, " "); if (!cmd) return;
        if (c.ok.some(re => re.test(cmd))) { S.daily[today()] = cmd; buzz([30, 40, 30]); earn(30, "daily challenge", { daily: cmd }); V.today(); }
        else { buzz(120); $("#dc-out").innerHTML = `<div class="callout bad">Not quite. Check the spelling and options, or try the hint.</div>`; }
      };
      $("#dc").onsubmit = check; $("#dc-go").onclick = check;
      $("#dc-hint").onclick = () => { $("#dc-out").innerHTML = `<div class="callout info">💡 ${esc(c.hint || "Think about which command does this.")}${c.a ? `<br><button class="btn" id="dc-ans" style="margin-top:8px;min-height:36px;padding:6px 12px">Show an answer</button>` : ""}</div>`; $("#dc-ans")?.addEventListener("click", () => { $("#dc-in").value = c.a; }); };
    }
    const p = await myProfile(), host = $("#me-stats");
    if (p?.stats && host?.isConnected) {
      const s = p.stats;
      host.innerHTML = `<div class="stats"><div class="stat"><b>🔥 ${s.streak || 0}</b><span>streak</span></div><div class="stat"><b>${(s.xp || 0).toLocaleString()}</b><span>XP</span></div><div class="stat"><b>${esc(s.rankEm || "🐧")}</b><span>${esc(s.rank || "rank")}</span></div></div>`;
    }
  };

  V.cards = () => {
    if (S.cardRun) return cardRun();
    app.innerHTML = `<div class="page"><div class="head">${TUX}<div><div class="eyebrow">// flashcards</div><h1>Flashcards</h1></div></div>
      <p class="muted">Tap a card to flip it. Cards you know come back less often; cards you miss come back tomorrow.</p>
      ${Object.entries(DECKS).map(([k, d]) => { const all = d.cards(), n = due(k).length, known = all.filter(c => (S.cards[c.id]?.box || 0) >= 3).length; return `<section class="card"><div class="row spread"><h2>${d.em} ${d.name}</h2><span class="tag ${n ? "butter" : "mint"}">${n ? `${n} due` : "all done"}</span></div>
        <div class="bar"><i style="width:${Math.round(known / all.length * 100)}%"></i></div><p class="tiny faint">${known} of ${all.length} learned</p>
        <button class="btn primary block" data-deck="${k}" ${n ? "" : "disabled"}>${n ? "Study 10" : "Come back tomorrow"}</button></section>`; }).join("")}
    </div>`;
    app.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => {
      const k = b.dataset.deck, list = due(k), fresh = list.filter(c => !S.cards[c.id]), old = list.filter(c => S.cards[c.id]);
      const pick = [...old.slice(0, 10), ...DA.shuffleSeeded(fresh, today() + k).slice(0, Math.max(0, 10 - old.length))].slice(0, 10);
      S.cardRun = { deck: k, ids: pick.map(c => c.id), i: 0, got: 0 }; save(); cardRun();
    });
  };
  function cardRun() {
    const r = S.cardRun, all = Object.fromEntries(DECKS[r.deck].cards().map(c => [c.id, c])), card = all[r.ids[r.i]];
    if (!card) {
      const got = r.got, n = r.ids.length; S.cardRun = null; save();
      if (n) earn(5, "flashcards done");
      app.innerHTML = `<div class="page" style="text-align:center;padding-top:8vh">${TUX.replace("<img", '<img width="120" height="120"')}<h1>Deck done!</h1><p class="muted">You knew ${got} of ${n}. Missed ones come back tomorrow.</p><button class="btn primary block" id="back">Back to decks</button></div>`;
      $("#back").onclick = () => V.cards(); return;
    }
    app.innerHTML = `<div class="page"><div class="row spread"><button class="btn" id="quit" style="min-height:38px;padding:6px 12px">✕</button><span class="small muted">${r.i + 1} / ${r.ids.length}</span></div>
      <div class="bar"><i style="width:${r.i / r.ids.length * 100}%"></i></div>
      <div class="deck"><div class="flash" id="flash" role="button" tabindex="0" aria-label="Flip card"><div class="front"><b class="${card.mono ? "mono" : ""}">${esc(card.front)}</b><span class="small faint">tap to flip</span></div>
        <div class="back"><p>${esc(card.back)}</p>${card.ex ? `<div class="term" style="justify-content:center"><span>$</span>${esc(card.ex)}</div>` : ""}</div></div></div>
      <div class="btns" id="grade" hidden><button class="btn bad" data-g="0">🔁 Again</button><button class="btn good" data-g="1">✅ Got it</button></div>
      <p class="tiny faint" style="text-align:center" id="flip-hint">Do you know what it means? Flip to check.</p></div>`;
    const flip = () => { $("#flash").classList.add("flipped"); $("#grade").hidden = false; $("#flip-hint").hidden = true; };
    $("#flash").onclick = flip; $("#flash").onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
    $("#quit").onclick = () => { S.cardRun = null; save(); V.cards(); };
    $("#grade").onclick = e => {
      const b = e.target.closest("[data-g]"); if (!b) return;
      const ok = b.dataset.g === "1", st = S.cards[card.id] || { box: 0 };
      st.box = ok ? Math.min(BOX_DAYS.length - 1, st.box + 1) : 0; st.due = addDays(today(), ok ? BOX_DAYS[st.box] : 1);
      S.cards[card.id] = st; r.i++; if (ok) { r.got++; S.xp += 2; S.days[today()] = (S.days[today()] || 0) + 2; const p = S.pending[today()] = S.pending[today()] || { xp: 0 }; p.xp += 2; flushSoon(); }
      buzz(ok ? 20 : 60); save(); cardRun();
    };
  }

  V.quiz = () => {
    if (S.quizRun) return quizRun();
    app.innerHTML = `<div class="page"><div class="head">${TUX}<div><div class="eyebrow">// quiz</div><h1>Quick quiz</h1></div></div>
      <section class="card"><h2>📚 Lesson quiz</h2><p class="muted small">10 questions from the core courses, with ${esc(distro().name)}'s commands.</p><button class="btn primary block" data-q="lesson">Start · +5 XP per right answer</button></section>
      <section class="card"><h2>🎓 Cert practice</h2><p class="muted small">10 harder, exam-style questions (unofficial practice, styled after Linux+ and RHCSA topics).</p><button class="btn soft block" data-q="cert">Start</button></section>
      <p class="tiny faint">Change the distro on the Me tab.</p></div>`;
    app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
      const pool = b.dataset.q === "cert" ? certQs() : lessonQs(), seed = String(Date.now());
      S.quizRun = { kind: b.dataset.q, qs: DA.shuffleSeeded(pool.map((_, i) => i), seed).slice(0, 10), i: 0, right: 0, seed }; save(); quizRun();
    });
  };
  function quizRun() {
    const r = S.quizRun, pool = r.kind === "cert" ? certQs() : lessonQs(), q = pool[r.qs[r.i]];
    if (!q) {
      const right = r.right, n = r.qs.length; S.quizRun = null; save();
      if (right === n) earn(10, "perfect quiz bonus");
      app.innerHTML = `<div class="page" style="text-align:center;padding-top:8vh">${TUX.replace("<img", '<img width="120" height="120"')}<h1>${right}/${n}</h1><p class="muted">${right === n ? "Perfect! Kernel-level brain." : right >= n * .7 ? "Nice work." : "Every miss is a lesson. Go again?"}</p><div class="btns"><button class="btn" id="back">Done</button><button class="btn primary" id="again">Again</button></div></div>`;
      $("#back").onclick = () => V.quiz(); $("#again").onclick = () => { V.quiz(); app.querySelector(`[data-q="${r.kind}"]`)?.click(); }; return;
    }
    const order = DA.shuffleSeeded(q.a.map((_, i) => i), r.seed + r.i);
    app.innerHTML = `<div class="page"><div class="row spread"><button class="btn" id="quit" style="min-height:38px;padding:6px 12px">✕</button><span class="small muted">${r.i + 1} / ${r.qs.length} · ${r.right} right</span></div>
      <div class="bar"><i style="width:${r.i / r.qs.length * 100}%"></i></div>
      <section class="card"><span class="tiny faint">${esc(q.from || "")}</span><h2 style="font-family:var(--body);font-weight:800;font-size:1.1rem">${q.q}</h2>
        <div class="opts">${order.map(k => `<button class="btn opt" data-k="${k}">${q.a[k]}</button>`).join("")}</div><div id="why"></div></section>
      <button class="btn primary block" id="next" hidden>Next</button></div>`;
    $("#quit").onclick = () => { S.quizRun = null; save(); V.quiz(); };
    app.querySelector(".opts").onclick = e => {
      const b = e.target.closest("[data-k]"); if (!b || app.querySelector(".opt.right")) return;
      const k = +b.dataset.k, ok = k === q.c;
      app.querySelectorAll(".opt").forEach(o => { if (+o.dataset.k === q.c) o.classList.add("right"); else if (o === b) o.classList.add("wrong"); o.disabled = true; });
      $("#why").innerHTML = `<div class="callout ${ok ? "good" : "bad"}">${ok ? "✅" : "❌"} ${q.why || ""}</div>`;
      if (ok) { r.right++; earn(5, "correct answer"); } buzz(ok ? 25 : 120);
      r.i++; save(); $("#next").hidden = false; $("#next").focus();
    };
    $("#next").onclick = quizRun;
  }

  V.friends = async () => {
    if (!signedIn()) {
      app.innerHTML = `<div class="page"><div class="head">${TUX}<div><div class="eyebrow">// friends</div><h1>Friends</h1></div></div><section class="card"><p>Sign in with your Distro Academy account to see your friends' leaderboard and activity, and send gifts.</p><button class="btn primary block" id="to-me">Sign in</button></section></div>`;
      $("#to-me").onclick = () => go("me"); return;
    }
    app.innerHTML = `<div class="page"><div class="head">${TUX}<div><div class="eyebrow">// friends</div><h1>Friends</h1></div></div><div id="fr" class="card"><p class="muted">Loading…</p></div></div>`;
    let friends = [], feed = [], mine = null;
    try {
      const P = "id,username,display_name,avatar,stats";
      const [fs, m] = await Promise.all([req("GET", `/rest/v1/friendships?select=status,requester:profiles!friendships_requester_fkey(${P}),addressee:profiles!friendships_addressee_fkey(${P})&status=eq.accepted`), myProfile()]);
      mine = m; friends = fs.map(f => f.requester.id === S.session.id ? f.addressee : f.requester);
      try { feed = await req("GET", "/rest/v1/activity?select=kind,detail,created_at,actor&kind=neq.pocket&order=created_at.desc&limit=15"); } catch { /* no feed table */ }
    } catch (e) { $("#fr").innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
    const people = Object.fromEntries([...friends, ...(mine ? [{ ...mine, display_name: "You" }] : [])].map(p => [p.id, p]));
    const board = [...friends, ...(mine ? [mine] : [])].sort((a, b) => (b.stats?.weekXP || 0) - (a.stats?.weekXP || 0));
    const say = a => { const d = a.detail || {}; return ({ badge: `unlocked ${esc(d.em || "")} <b>${esc(d.name || "")}</b>`, lab: `fixed the lab <b>${esc(d.name || "")}</b>`, boss: `beat the boss <b>${esc(d.name || "")}</b>!`, rank: `ranked up to ${esc(d.em || "")} <b>${esc(d.name || "")}</b>`, season: `reached season tier <b>${+d.tier || 0}</b>`, streak: `hit a <b>${+d.days || 0}-day streak</b> 🔥`, tournament: `scored <b>${(+d.score || 0).toLocaleString()}</b> in the tournament`, gift: `sent a gift to <b>${esc(d.to || "a friend")}</b> 🎁` })[a.kind] || esc(a.kind); };
    const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 2 ? "now" : m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`; };
    if (!$("#fr")) return;
    $("#fr").outerHTML = `<section class="card"><h2>🏆 This week</h2>${friends.length ? `<div class="list">${board.map((p, i) => `<div class="li ${p.id === S.session.id ? "you" : ""}"><span class="place">${["🥇", "🥈", "🥉"][i] || i + 1}</span><span class="av">${avatar(p.avatar)}</span><span class="who"><b>${p.id === S.session.id ? "You" : esc(nameOf(p))}</b><span class="tiny faint">🔥 ${p.stats?.streak || 0} · ${esc(p.stats?.rank || "")}</span></span><span class="mono small"><b>${(p.stats?.weekXP || 0).toLocaleString()}</b> XP</span>${p.id === S.session.id ? "" : `<button class="btn" style="min-height:36px;padding:4px 10px" data-gift="${esc(p.id)}" aria-label="Send a gift">🎁</button>`}</div>`).join("")}</div>` : `<p class="muted small">No friends yet. Add friends in the desktop app: Friends → search their username.</p>`}</section>
      <section class="card"><h2>✨ Activity</h2>${feed.length ? `<div class="list">${feed.map(a => `<div class="li"><span class="who small"><b style="display:inline">${esc(nameOf(people[a.actor]))}</b> ${say(a)}</span><span class="tiny faint">${ago(a.created_at)}</span></div>`).join("")}</div>` : `<p class="muted small">Nothing yet.</p>`}</section>`;
    app.querySelectorAll("[data-gift]").forEach(b => b.onclick = () => giftSheet(friends.find(f => f.id === b.dataset.gift)));
  };
  const GIFTS = { freeze: ["🧊", "Streak freeze"], cheer: ["📣", "Cheer"], xp: ["⭐", "XP boost"], larry: ["💀", "Larry"] };
  function giftSheet(p) {
    const bg = document.createElement("div"); bg.className = "sheet-bg";
    bg.innerHTML = `<div class="sheet" role="dialog" aria-label="Send a gift"><h2>🎁 Gift for ${esc(nameOf(p))}</h2><p class="small muted">One gift per friend per day.</p>
      <div class="choices">${Object.entries(GIFTS).map(([k, [em, n]], i) => `<button class="choice ${i ? "" : "on"}" data-k="${k}"><span>${em}</span><b>${n}</b></button>`).join("")}</div>
      <input class="input" id="g-note" maxlength="120" placeholder="Add a note (optional)"><div class="btns"><button class="btn" id="g-x">Cancel</button><button class="btn primary" id="g-send">Send</button></div></div>`;
    document.body.appendChild(bg);
    let kind = "freeze";
    bg.onclick = e => { if (e.target === bg) bg.remove(); const c = e.target.closest("[data-k]"); if (c) { kind = c.dataset.k; bg.querySelectorAll("[data-k]").forEach(x => x.classList.toggle("on", x === c)); } };
    bg.querySelector("#g-x").onclick = () => bg.remove();
    bg.querySelector("#g-send").onclick = async e => {
      e.target.disabled = true;
      try { await req("POST", "/rest/v1/gifts", { recipient: p.id, kind, note: bg.querySelector("#g-note").value.slice(0, 120) }, { headers: { Prefer: "return=minimal" } }); bg.remove(); toast(`🎁 Sent to ${nameOf(p)}!`); buzz([20, 30, 20]); }
      catch (err) { e.target.disabled = false; toast(/duplicate|unique/i.test(err.message) ? "You've already sent them a gift today." : err.message); }
    };
  }

  V.me = async () => {
    const pend = Object.values(S.pending).reduce((n, p) => n + (p.xp || 0), 0);
    app.innerHTML = `<div class="page"><div class="head">${TUX}<div><div class="eyebrow">// me</div><h1>${signedIn() ? "@" + esc(S.session.username || "you") : "Me"}</h1></div></div>
      ${signedIn() ? `<section class="card"><h2>☁️ Synced</h2><p class="small muted">${pend ? `${pend} XP waiting to send…` : "Everything you earn here goes to your account. The desktop app adds it to your XP and counts the day toward your streak."}</p><button class="btn" id="out">Sign out</button></section>`
      : `<section class="card"><h2>Sign in</h2><p class="small muted">Use the same username and password as in the desktop app (Friends page). New here? Make an account in the desktop app first.</p>
        <form id="login" style="display:grid;gap:10px"><input class="input" id="u" autocomplete="username" autocapitalize="off" placeholder="Username" required><input class="input" id="pw" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn primary block">Sign in</button><p class="small" id="err" style="color:var(--bad)"></p></form></section>`}
      <section class="card"><h2>Settings</h2>
        <label class="small muted" for="nm">Your name</label><input class="input" id="nm" maxlength="24" value="${esc(S.name)}" placeholder="Optional">
        <label class="small muted" for="ds">Quiz distro</label><select class="input" id="ds">${DA.DISTROS.map(d => `<option value="${d.id}" ${d.id === S.distro ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select>
        <span class="small muted">Theme</span><div class="btns" style="grid-template-columns:repeat(3,1fr)">${[["auto", "Auto"], ["light", "☀️ Light"], ["dark", "🌙 Dark"]].map(([k, l]) => `<button class="btn ${S.theme === k ? "soft" : ""}" data-th="${k}">${l}</button>`).join("")}</div></section>
      <section class="card"><h2>📲 Put it on your home screen</h2><p class="small muted"><b>iPhone:</b> Share → Add to Home Screen. <b>Android:</b> ⋮ menu → Add to Home screen (or Install app). It opens full-screen like an app.</p></section>
      <section class="card"><div class="stats"><div class="stat"><b>${S.xp.toLocaleString()}</b><span>pocket XP</span></div><div class="stat"><b>${Object.keys(S.daily).length}</b><span>dailies</span></div><div class="stat"><b>${Object.values(S.cards).filter(c => c.box >= 3).length}</b><span>cards learned</span></div></div></section>
      <p class="tiny faint" style="text-align:center">Distro Academy Pocket · Tux by Larry Ewing, made with The GIMP</p></div>`;
    $("#login")?.addEventListener("submit", async e => {
      e.preventDefault(); const b = e.target.querySelector("button"); b.disabled = true; $("#err").textContent = "";
      try { await logIn($("#u").value, $("#pw").value); toast("Signed in 🐧"); V.me(); } catch (err) { $("#err").textContent = err.message; b.disabled = false; }
    });
    $("#out")?.addEventListener("click", async () => { await logOut(); V.me(); });
    $("#nm").oninput = e => { S.name = e.target.value.trim(); save(); };
    $("#ds").onchange = e => { S.distro = e.target.value; save(); toast(`Quizzes now use ${distro().name}`); };
    app.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { S.theme = b.dataset.th; save(); applyTheme(); V.me(); });
  };

  function render() { tabs(); V[tab](); }
  const fromHash = () => { const h = location.hash.slice(1); tab = TABS.some(t => t[0] === h) ? h : "today"; };
  window.addEventListener("hashchange", () => { fromHash(); render(); });
  fromHash(); render(); flush();
  window.DAPocket = { S, earn, flush, req, logIn, logOut }; // for tests
})();

</script>
</body>
</html>
