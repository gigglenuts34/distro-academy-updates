:root {
  color-scheme: light;
  --bg: #f4f2fb; --surface: #ffffff; --surface-2: #eeebf8; --ink: #241f3d; --ink-soft: #625b85; --ink-faint: #9690b2; --line: #e0dbef;
  --accent: #7d69e6; --accent-ink: #fff; --accent-soft: #ebe6fd;
  --mint: #cfeedf; --mint-ink: #22654b; --peach: #fbe0d3; --peach-ink: #874f35; --sky: #d3e6f8; --sky-ink: #2e5a83; --butter: #f6ecc5; --butter-ink: #7e600c; --sakura: #f8dbe7; --sakura-ink: #82415d;
  --good: #23865c; --bad: #c93d55;
  --term-bg: #1e1c2b; --term-fg: #e6e1ff; --term-a: #b4a7ff;
  --shadow: 0 1px 2px rgb(30 25 60 / .05), 0 10px 28px -14px rgb(30 25 60 / .22);
  --r: 18px;
  --display: "Fredoka", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #16131f; --surface: #221e31; --surface-2: #2b263d; --ink: #eeeaff; --ink-soft: #b5addb; --ink-faint: #8a83ab; --line: #363049;
    --accent: #b4a7ff; --accent-ink: #1b1730; --accent-soft: #332c52;
    --mint: #1f3d33; --mint-ink: #9fe3c4; --peach: #45302a; --peach-ink: #ffc6a8; --sky: #233548; --sky-ink: #a9d0f5; --butter: #3f3720; --butter-ink: #f2dc8f; --sakura: #43293a; --sakura-ink: #f6b5cf;
    --good: #7fdcb0; --bad: #ff9fb6; --shadow: 0 10px 30px -16px rgb(0 0 0 / .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16131f; --surface: #221e31; --surface-2: #2b263d; --ink: #eeeaff; --ink-soft: #b5addb; --ink-faint: #8a83ab; --line: #363049;
  --accent: #b4a7ff; --accent-ink: #1b1730; --accent-soft: #332c52;
  --mint: #1f3d33; --mint-ink: #9fe3c4; --peach: #45302a; --peach-ink: #ffc6a8; --sky: #233548; --sky-ink: #a9d0f5; --butter: #3f3720; --butter-ink: #f2dc8f; --sakura: #43293a; --sakura-ink: #f6b5cf;
  --good: #7fdcb0; --bad: #ff9fb6; --shadow: 0 10px 30px -16px rgb(0 0 0 / .6);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .88em; }
code { background: var(--surface-2); padding: .1em .4em; border-radius: 6px; overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.2; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--ink-soft); } .faint { color: var(--ink-faint); } .small { font-size: .88rem; } .tiny { font-size: .76rem; }

#app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(var(--safe-b) + 96px); }
.boot { display: grid; place-items: center; gap: 10px; padding-top: 30vh; color: var(--ink-soft); }
.page { display: grid; gap: 14px; animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .page, .card-flip { animation: none !important; transition: none !important; } }

.head { display: flex; align-items: center; gap: 12px; }
.head img { width: 52px; height: 52px; flex: none; }
.head .eyebrow { font-family: var(--mono); font-size: .75rem; color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-size: 1.35rem; }
.stat span { font-size: .74rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: .78rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.tag.mint { background: var(--mint); color: var(--mint-ink); } .tag.peach { background: var(--peach); color: var(--peach-ink); } .tag.butter { background: var(--butter); color: var(--butter-ink); }

.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 16px; font-weight: 700; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn.good { background: var(--mint); color: var(--mint-ink); border-color: transparent; }
.btn.bad { background: var(--peach); color: var(--peach-ink); border-color: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); min-height: 46px; }
.input:focus, .btn:focus-visible { outline: 3px solid var(--accent-soft); outline-color: color-mix(in oklab, var(--accent) 45%, transparent); }
.term { background: var(--term-bg); color: var(--term-fg); border-radius: 14px; padding: 10px 12px; font-family: var(--mono); font-size: .92rem; display: flex; align-items: center; gap: 8px; }
.term span { color: var(--term-a); }
.term input { flex: 1; min-width: 0; background: transparent; border: 0; color: inherit; font: inherit; outline: none; }
.callout { border-radius: 14px; padding: 10px 12px; font-size: .92rem; }
.callout.good { background: var(--mint); color: var(--mint-ink); } .callout.bad { background: var(--peach); color: var(--peach-ink); } .callout.info { background: var(--sky); color: var(--sky-ink); }

/* flashcards */
.deck { perspective: 1200px; }
.flash { position: relative; min-height: 230px; border-radius: 22px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.flash.flipped { transform: rotateY(180deg); }
.flash > div { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; padding: 22px; display: grid; place-content: center; text-align: center; gap: 10px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.flash .front { background: var(--surface); }
.flash .back { background: var(--accent-soft); transform: rotateY(180deg); }
.flash .front b { font-family: var(--display); font-size: 1.7rem; font-weight: 600; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s; }

/* quiz */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; justify-content: flex-start; font-weight: 600; }
.opt.right { background: var(--mint); color: var(--mint-ink); border-color: transparent; }
.opt.wrong { background: var(--peach); color: var(--peach-ink); border-color: transparent; }

/* friends */
.list { display: grid; gap: 2px; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .who { flex: 1; min-width: 0; }
.li .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 1.2rem; flex: none; overflow: hidden; }
.av img { width: 30px; height: 30px; }
.place { width: 26px; text-align: center; font-weight: 800; }
.li.you { background: var(--accent-soft); border-radius: 12px; border: 0; padding-inline: 8px; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 2px; padding: 6px 8px calc(var(--safe-b) + 6px); background: color-mix(in oklab, var(--surface) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabs button { flex: 1; max-width: 110px; appearance: none; border: 0; background: none; padding: 6px 2px; border-radius: 14px; display: grid; justify-items: center; gap: 2px; font-size: .72rem; font-weight: 700; color: var(--ink-faint); cursor: pointer; }
.tabs button .em { font-size: 1.3rem; line-height: 1; filter: grayscale(.6); opacity: .8; }
.tabs button.on { color: var(--accent); background: var(--accent-soft); }
.tabs button.on .em { filter: none; opacity: 1; }

.toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 84px); transform: translateX(-50%); z-index: 9; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: .92rem; box-shadow: var(--shadow); animation: rise .25s; max-width: calc(100vw - 32px); text-align: center; }
.sheet-bg { position: fixed; inset: 0; z-index: 8; background: rgb(10 8 20 / .45); display: grid; align-items: end; }

  DA.h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  DA.$ = (sel, root = document) => root.querySelector(sel);
  DA.$$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  DA.copy = async (text) => {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch { /* ignore */ }

    }
  };

  DA.toast = (html, kind = "") => {
    let box = DA.$(".toasts");
    if (!box) { box = DA.h('<div class="toasts" role="status" aria-live="polite"></div>'); document.body.appendChild(box); }
    const same = [...box.children].find(x => x.dataset.html === html && x.style.opacity !== "0");
    if (same) { same.dataset.n = +same.dataset.n + 1; same.innerHTML = `${html} <b class="mono">×${same.dataset.n}</b>`; clearTimeout(same._t1); clearTimeout(same._t2); arm(same); return; }
    const t = DA.h(`<div class="toast ${kind}">${html}</div>`);

    box.appendChild(t);
    while (box.children.length > 3) box.firstElementChild.remove();

      t._t1 = setTimeout(() => { t.style.transition = "opacity .3s, transform .3s"; t.style.opacity = "0"; t.style.transform = "translateY(8px)"; }, 2400);

  };

  let actx = null, lastSound = 0;
  DA.sound = (kind) => {
    if (!DA.state?.settings.learn.sound) return;
    const now = performance.now();
    if (now - lastSound < 150) return; // never stack sounds on top of each other
    lastSound = now;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const notes = { ok: [660, 880], bad: [300, 220], done: [523, 659, 784, 1047], level: [523, 659, 784, 1047, 1319], click: [900], xp: [880, 1175] }[kind] || [600];

  DA.confetti = (amount = 90) => {
    if (document.documentElement.dataset.motion === "off" || (matchMedia("(prefers-reduced-motion: reduce)").matches && document.documentElement.dataset.motion !== "on")) return;

    if (!cv) { cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv); }
    const run = ++confettiRun, W = cv.width = innerWidth, H = cv.height = innerHeight, ctx = cv.getContext("2d");
    const cs = getComputedStyle(document.documentElement);
    const cols = ["--accent", "--mint", "--peach", "--sky", "--sakura", "--butter", "--lav"].map(v => cs.getPropertyValue(v).trim() || "#b2a5ff");
    const P = Array.from({ length: Math.min(amount, 120) }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5, r: 4 + Math.random() * 4, c: DA.pick(cols), a: Math.random() * 6, s: Math.random() < .5 }));
    const t0 = performance.now();
    (function tick() {
      if (run !== confettiRun) return;
      ctx.clearRect(0, 0, W, H);
      let alive = 0;
      for (const p of P) {
        p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += .15;
        if (p.y > H + 20) continue;
        alive++; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;

        ctx.restore();
      }

    })();
  };

  DA.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
})();

/* Native bridge (launcher) with browser fallbacks. */
(function () {
  const pending = {};
  let seq = 0;
  DA.isNative = () => !!(window.__DA_NATIVE__ && window.webkit?.messageHandlers?.da);
  DA._nativeReply = (id, data) => { const p = pending[id]; if (p) { delete pending[id]; p(data); } };
  const callNative = (type, payload) => new Promise(resolve => { const id = ++seq; pending[id] = resolve; window.webkit.messageHandlers.da.postMessage(JSON.stringify({ type, id, ...payload })); });
  DA.callNative = callNative;

  // POST helper used by the optional AI tutor. Returns {status, text}; status 0 = network failure.
  DA.httpPost = async (url, headers, body) => {
    if (DA.isNative()) return callNative("http", { url, headers, body });
    try { const r = await fetch(url, { method: "POST", headers, body }); return { status: r.status, text: await r.text() }; }
    catch (e) { return { status: 0, text: String(e.message || e) }; }
  };

  // Saves a file: native → real folder (returns "~/Pictures/x.png"); browser → download.
  DA.saveFile = async ({ name, text, b64, mime = "application/octet-stream", dir = "documents" }) => {
    if (DA.isNative()) { const r = await callNative("saveFile", { name, dir, ...(b64 ? { b64 } : { text }) }); return r.path; }
    const blob = b64 ? new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: mime }) : new Blob([text], { type: mime });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return name;
  };

  // Minimal, safe Markdown → HTML (escape first) for AI replies.
  DA.md = (src) => {
    const blocks = String(src || "").replace(/\r/g, "").split(/```/);
    return blocks.map((part, i) => {
      if (i % 2) { const code = part.replace(/^[\w+-]*\n/, "").replace(/\n$/, ""); return `<div class="cmd"><code>${DA.esc(code)}</code><span class="row" style="gap:6px"><button type="button" data-copy="${DA.esc(code)}">Copy</button></span></div>`; }
      const inline = t => DA.esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>");
      const out = []; let list = null;
      part.split("\n").forEach(line => {
        const li = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/), hd = line.match(/^#{1,4}\s+(.*)$/);
        if (li) { if (!list) { list = []; } list.push(`<li>${inline(li[1])}</li>`); return; }
        if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
        if (hd) out.push(`<p><b>${inline(hd[1])}</b></p>`);
        else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
      });
      if (list) out.push(`<ul>${list.join("")}</ul>`);
      return out.join("");
    }).join("");
  };
})();

/* Tux mascot, avatars and names. */
(function () {
  // The real Tux (js/tux-art.js), loaded once as a blob and referenced by every Tux in the app.
  // Drawn at 86% size with headroom so Tux's wardrobe hats fit inside the 64×64 box.
  const tuxURL = (() => { try { return URL.createObjectURL(new Blob([DA.TUX_SVG], { type: "image/svg+xml" })); } catch { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(DA.TUX_SVG); } })();
  const tuxImg = (x, y, w, h) => `<image href="${tuxURL}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`;
  DA.TUX_URL = tuxURL;
  DA.TUX = (cls = "") => `<svg class="tux ${cls}" viewBox="0 0 64 64" aria-hidden="true">${tuxImg(8.8, 9, 46.4, 55)}</svg>`;
  // App logo: Tux on a soft gradient tile.
  DA.LOGO = `<svg class="logo-svg" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9d0ff"/><stop offset=".55" stop-color="#c7e2fb"/><stop offset="1" stop-color="#bfead6"/></linearGradient></defs><rect x="0" y="0" width="64" height="64" rx="18" fill="url(#lg-bg)"/>${tuxImg(11, 7, 42, 50)}</svg>`;
  DA.avatarHTML = (a, cls = "") => a === "tux" || !a ? `<span class="av-tux ${cls}">${DA.TUX()}</span>` : DA.esc(a);

  // Your Linux-style username (used in the practice terminal) and how the app addresses you.
  DA.userName = () => (DA.state?.profile.name || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9_-]/g, "").slice(0, 20) || "tux";
  DA.displayName = () => DA.state?.profile.name?.trim() || "friend";
})();

        <h3>How a command is built</h3>
        <p>Most commands look like ${c("command -options arguments")}. For example, in ${c("ls -l /home")}, ${c("ls")} is the command, ${c("-l")} is an option ("long format") and ${c("/home")} is what to act on.</p>

        { q: "What does <code>pwd</code> show?", a: ["Your password", "The folder you're currently in", "Running programs", "Your Wi-Fi status"], c: 1, why: "pwd = print working directory. It's your \"you are here\" sign." },
        { q: "In the prompt, what does <code>~</code> mean?", a: ["The root of the drive", "Your home folder", "An error", "The previous folder"], c: 1, why: "~ is shorthand for /home/yourname." },
        { q: "Which key auto-completes file and command names?", a: ["Esc", "Ctrl", "Tab", "Shift"], c: 2, why: "Tab completion saves typing and typos. Smash that Tab." }
      ]
    },
    {
      id: "c2", title: "The Linux filesystem map", mins: 8, icon: "folder",
      blurb: "Everything starts at /. Learn what lives in /etc, /home, /usr and friends.",
      body: (d) => `
        <p>Windows has C:\\ and D:\\. Linux has <b>one tree</b> that starts at ${c("/")}, called "root". Every drive, USB stick and setting hangs off that one tree.</p>
        <h3>The folders that matter</h3>
        <ul>
          <li>${c("/home")}: your personal stuff (${c("/home/" + DA.userName())}).</li>
          <li>${c("/etc")}: system-wide settings, all plain text files.</li>
          <li>${c("/usr")}: installed programs and libraries.</li>
          <li>${c("/var")}: things that change, like logs and caches.</li>
          <li>${c("/tmp")}: scratch space that gets cleaned up.</li>
          <li>${c("/boot")}: the kernel and bootloader.</li>
          <li>${c("/dev")}: your hardware shown as files (yes, really).</li>
        </ul>
        ${d.pkg === "nix" || d.pkg === "guix" ? tip(`${d.name} bends this rule: programs live in ${c(d.pkg === "nix" ? "/nix/store" : "/gnu/store")} with unique hashed folder names. That's how it can keep several versions side by side.`, "") : ""}
        ${["silverblue", "bazzite", "aeon", "vanilla", "steamos"].includes(d.id) ? tip(`On ${d.name}, ${c("/usr")} is <b>read-only</b>, so the core system can't be accidentally broken. Your stuff in /home and /etc is still yours to change.`, "") : ""}
        <h3>Paths</h3>
        <p>An <b>absolute</b> path starts from root: ${c("/etc/os-release")}. A <b>relative</b> path starts from where you are: ${c("Documents/notes.txt")}. ${c("..")} means "one folder up" and ${c(".")} means "right here".</p>
        ${tip(`Try ${c("cat /etc/os-release")} on any Linux machine to see exactly which distro and version it is.`)}`,
      cmds: () => [["cd /", "Go to the root of everything"], ["ls /", "See the top-level folders"], ["cd /etc", "Go to the settings folder"], ["cat /etc/os-release", "Show which distro this is"], ["cd ..", "Go up one level"], ["cd ~", "Teleport home (just cd works too)"]],
      steps: () => [
        { t: "Jump to the root: <code>cd /</code>", re: /^cd \/$/ },
        { t: "List the top-level folders: <code>ls</code>", re: /^ls( \/)?( -\w+)?$/ },
        { t: "Read the distro ID card: <code>cat /etc/os-release</code>", re: /^cat \/etc\/os-release$/ },
        { t: "Go back home with <code>cd ~</code>", re: /^cd( ~)?$/ }
      ],
      quiz: () => [
        { q: "Where do system-wide config files live?", a: ["/home", "/etc", "/tmp", "/dev"], c: 1, why: "/etc holds settings for the whole system, mostly as editable text files." },
        { q: "What does <code>cd ..</code> do?", a: ["Deletes the folder", "Goes up one folder", "Goes home", "Lists hidden files"], c: 1, why: ".. always means the parent folder." },
        { q: "Your personal files are in…", a: ["/usr", "/root", "/home/yourname", "/boot"], c: 2, why: "Each user gets a folder under /home. /root is only for the root user." }
      ]
    },
    {
      id: "c3", title: "Files & folders like a pro", mins: 9, icon: "file",
      blurb: "Create, copy, move, rename and delete, all without a mouse.",
      body: () => `
        <p>Everything you do in a file manager has a faster terminal version. Here are the core moves:</p>
        <ul>
          <li>${c("mkdir projects")}: make a folder</li>
          <li>${c("touch notes.txt")}: create an empty file</li>
          <li>${c("cp a.txt b.txt")}: copy (add ${c("-r")} for folders)</li>
          <li>${c("mv old.txt new.txt")}: move <i>or</i> rename</li>
          <li>${c("rm file.txt")}: delete (${c("rm -r")} for folders)</li>
        </ul>
        ${tip(`${c("rm")} has <b>no trash bin</b>. Deleted means gone. Get in the habit of double-checking, especially with ${c("rm -r")}. Never run ${c("rm -rf /")}. Ever.`, "warn")}
        <h3>Writing into files</h3>
        <p>${c(">")} sends a command's output into a file (and <b>overwrites</b> it). ${c(">>")} <b>appends</b> to the end. So ${c("echo \"buy milk\" >> todo.txt")} adds a line without erasing the rest.</p>
        <h3>Reading files</h3>
        <p>${c("cat")} dumps a whole file. ${c("less")} lets you scroll (q quits). ${c("head")} and ${c("tail")} show the start or end. ${c("tail -f")} follows a file live, which is great for logs.</p>`,
      cmds: () => [["mkdir projects", "Create a folder"], ["cd projects", "Step inside it"], ["touch notes.txt", "Create an empty file"], ["echo \"Linux is fun\" > notes.txt", "Write a line into it"], ["cat notes.txt", "Read it back"], ["cp notes.txt backup.txt", "Copy it"], ["mv backup.txt old.txt", "Rename it"], ["rm old.txt", "Delete it"]],
      steps: () => [
        { t: "Make a folder: <code>mkdir projects</code>", re: /^mkdir (-p )?projects$/ },
        { t: "Move into it: <code>cd projects</code>", re: /^cd projects\/?$/ },
        { t: "Write a file: <code>echo \"Linux is fun\" > notes.txt</code>", re: /^echo .+ >>? ?notes\.txt$/ },
        { t: "Read it: <code>cat notes.txt</code>", re: /^cat notes\.txt$/ },
        { t: "Make a copy: <code>cp notes.txt backup.txt</code>", re: /^cp notes\.txt \S+$/ }
      ],
      quiz: () => [
        { q: "How do you rename a file in the terminal?", a: ["rename", "mv", "cp", "rn"], c: 1, why: "mv moves files, and moving to a new name in the same folder is a rename." },
        { q: "What's the difference between <code>></code> and <code>>></code>?", a: ["None", "> appends, >> overwrites", "> overwrites, >> appends", ">> is for folders"], c: 2, why: "One arrow replaces the file; two arrows add to the end." },
        { q: "Where do files go after <code>rm</code>?", a: ["The trash", "/tmp", "They're gone", "A backup folder"], c: 2, why: "rm doesn't use a trash bin. Be careful!" }
      ]
    },
    {
      id: "c4", title: "Permissions & sudo", mins: 10, icon: "lock",
      blurb: "Why 'Permission denied' happens, what rwx means, and when to use sudo.",
      body: (d) => `
        <p>Every file has an <b>owner</b>, a <b>group</b>, and permissions for three kinds of people: the owner (u), the group (g) and everyone else (o).</p>
        <p>Run ${c("ls -l")} and you'll see something like ${c(`-rwxr-xr-- 1 ${DA.userName()} ${DA.userName()} 120 notes.sh`)}:</p>
        <ul>
          <li>${c("r")} = read, ${c("w")} = write, ${c("x")} = execute (run it)</li>
          <li>The first trio is the owner, the second is the group, the third is everyone else</li>
        </ul>
        <h3>Changing permissions</h3>
        <p>${c("chmod +x script.sh")} makes a script runnable. ${c("chmod 600 secret.txt")} means only you can read and write it. Numbers are shorthand: r=4, w=2, x=1, so 7=rwx, 6=rw-, 5=r-x and 4=r--.</p>
        <h3>sudo: borrow the admin's powers</h3>
        <p>${c("sudo")} runs one command as root. You'll need it for installing software or editing files in /etc. ${d.id === "alpine" ? `On Alpine you might use ${c("doas")} instead. It's a tiny sudo alternative.` : `On ${d.name}, your user gets sudo rights by being in the ${c(["debian", "ubuntu", "mint", "popos", "kali"].includes(d.id) || d.family === "debian" ? "sudo" : "wheel")} group.`}</p>
        ${tip(`If something says <b>Permission denied</b>, don't just slap sudo in front of it. First ask why: is it a system file, or did a script just lose its +x?`, "")}`,
      cmds: () => [["ls -l", "Show permissions, owner and size"], ["touch hello.sh", "Create a script file"], ["chmod +x hello.sh", "Make it executable"], ["chmod 600 secret.txt", "Private: only you can read/write"], ["sudo whoami", "Prints 'root': sudo works!"], ["groups", "Which groups are you in?"]],
      steps: () => [
        { t: "Create a file: <code>touch hello.sh</code>", re: /^touch hello\.sh$/ },
        { t: "Look at its permissions: <code>ls -l</code>", re: /^ls -l\w*( .+)?$/ },
        { t: "Make it executable: <code>chmod +x hello.sh</code>", re: /^chmod (\+x|u\+x|7\d\d|5\d\d) hello\.sh$/ },
        { t: "Check you're an admin: <code>sudo whoami</code>", re: /^(sudo|doas) whoami$/ }
      ],
      quiz: () => [
        { q: "What does <code>chmod +x</code> do?", a: ["Deletes a file", "Makes it executable", "Hides it", "Changes the owner"], c: 1, why: "x = execute. Scripts need it to run with ./script.sh" },
        { q: "In <code>chmod 640</code>, what can the group do?", a: ["Nothing", "Read", "Read and write", "Everything"], c: 1, why: "6=rw for the owner, 4=r for the group, 0=nothing for others." },
        { q: "When should you use <code>sudo</code>?", a: ["Always, to be safe", "Only when a task needs admin rights", "Never", "To make commands faster"], c: 1, why: "sudo means root power. Use it on purpose, not by reflex." }
      ]
    },
    {
      id: "c5", title: "Installing software", mins: 10, icon: "package",
      blurb: (d) => `Master ${DA.pkgOf(d).name}, ${d.name}'s package manager: search, install, update, remove.`,
      body: (d) => {
        const P = DA.pkgOf(d);
        return `
        <p>On Linux you don't hunt for installers on random websites. A <b>package manager</b> downloads software from trusted repositories, handles dependencies and keeps everything updated in one go. ${d.name} uses <b>${P.name}</b>.</p>
        ${P.note ? tip(P.note, "") : ""}
        <h3>The big five</h3>
        <ul>
          <li><b>Search:</b> ${c(DA.fill(P.search, "htop"))}</li>
          <li><b>Install:</b> ${c(DA.fill(P.install, "htop"))}</li>
          <li><b>Update everything:</b> ${c(P.update)}</li>
          <li><b>Remove:</b> ${c(DA.fill(P.remove, "htop"))}</li>
          <li><b>Clean up leftovers:</b> ${c(P.clean)}</li>
        </ul>
        ${P.try ? `<p>Want to try something without installing it? ${c(DA.fill(P.try, "cowsay"))} gives you a temporary shell with it.</p>` : ""}
        ${d.family === "arch" && d.pkg === "pacman" ? tip(`Arch users also get the <b>AUR</b>: thousands of community packages, installed with a helper like ${c(d.id === "cachyos" ? "paru" : "yay")}. Always read the PKGBUILD before you trust it.`, "") : ""}
        <h3>Universal apps</h3>
        <p><b>Flatpak</b> works on almost every distro and runs apps in a sandbox. Flathub has Discord, Spotify, OBS, Steam and more: ${c("flatpak install flathub com.discordapp.Discord")}.</p>
        ${d.release.startsWith("Rolling") ? tip(`${d.name} is <b>rolling</b>, so update often (every few days) instead of letting months pile up. Big jumps are where things break.`, "warn") : ""}`;
      },
      cmds: (d) => { const P = DA.pkgOf(d); return [[DA.fill(P.search, "htop"), "Search the repos"], [DA.fill(P.install, "htop"), "Install htop, a pretty process viewer"], ["htop", "Run it (q to quit)"], [P.update, "Update the whole system"], [DA.fill(P.remove, "htop"), "Remove it again"], [P.list, "List installed packages"]]; },
      steps: (d) => {
        const sim = DA.simPkg(d);
        if (!sim.ok) return [
          { t: `${d.name} installs software in its own way (see above). Practice the idea with Flatpak, which works here too: <code>flatpak search htop</code>`, re: /^flatpak search .+/ },
          { t: "Install something: <code>flatpak install flathub org.gnome.Calculator</code>", re: /^flatpak install .+/ },
          { t: "Update everything: <code>flatpak update</code>", re: /^flatpak update$/ }
        ];
        const P = sim.P;
        const s = [];
        if (P.sim.search) s.push({ t: `Search for htop: <code>${DA.esc(DA.fill(P.search, "htop"))}</code>`, act: "search" });
        s.push({ t: `Install it: <code>${DA.esc(DA.fill(P.try || P.install, "htop"))}</code>`, act: "install" });
        s.push({ t: "Run it: <code>htop</code>", re: /^htop$/ });
        s.push({ t: `Update the system: <code>${DA.esc(P.update)}</code>`, act: "update" });
        return s;
      },
      quiz: (d) => { const P = DA.pkgOf(d); return [
        { q: `Which command updates everything on ${d.name}?`, a: DA.shuffleSeeded([P.update, "sudo update-all", "apt-get fix", "sudo yay --everything"].filter((v, i, a) => a.indexOf(v) === i), d.id), cAns: P.update, why: `${P.update} refreshes the package lists and upgrades everything.` },
        { q: "Why use a package manager instead of downloading installers?", a: ["It's slower", "Trusted sources, automatic dependencies and one-command updates", "It needs internet less", "No reason"], c: 1, why: "It's like an app store for the whole system, including the system itself." },
        { q: "What's Flatpak?", a: ["A file format for zip files", "A universal, sandboxed app format", "A distro", "A Linux kernel"], c: 1, why: "Flatpak apps run on almost any distro, isolated from the system." }
      ]; }
    },
    {
      id: "c6", title: "Processes & services", mins: 10, icon: "cpu",
      blurb: (d) => `See what's running, stop what's stuck and control background services with ${DA.initOf(d).name}.`,
      body: (d) => {
        const I = DA.initOf(d);
        return `
        <p>Every running program is a <b>process</b> with an ID number (PID). Some run in the background without a window. Those are <b>services</b> (also called daemons), like Bluetooth, networking or SSH.</p>
        <h3>Watching processes</h3>
        <ul>
          <li>${c("ps aux")}: snapshot of everything running</li>
          <li>${c("htop")} or ${c("btop")}: live, colorful task manager</li>
          <li>${c("kill 1234")}: politely ask PID 1234 to stop. ${c("kill -9 1234")} forces it.</li>
          <li>${c("pkill firefox")}: kill by name</li>
        </ul>
        <h3>Services with ${I.name}</h3>
        <p>${d.name} uses <b>${I.name}</b> as its init system: the very first process (PID 1), which starts everything else.</p>
        <ul>
          <li>Status: ${c(DA.fill(I.status, svc(d)))}</li>
          <li>Start now: ${c(DA.fill(I.start, svc(d)))}</li>
          <li>Start on every boot: ${c(DA.fill(I.enable, svc(d)))}</li>
          <li>Stop: ${c(DA.fill(I.stop, svc(d)))}</li>
        </ul>
        ${d.init !== "systemd" ? tip(`Most online guides assume systemd (${c("systemctl")}). On ${d.name}, translate them to ${I.name} commands. That's a superpower once you get it.`, "") : tip(`${c("systemctl")} works the same on most big distros, so what you learn here transfers almost everywhere.`)}`;
      },
      cmds: (d) => { const I = DA.initOf(d); return [["ps aux", "List every process"], ["htop", "Live task manager"], ["pkill firefox", "Kill a program by name"], [DA.fill(I.status, "bluetooth"), "Is Bluetooth running?"], [DA.fill(I.enable, "bluetooth"), "Turn it on at boot"], [I.list, "All services"]]; },
      steps: (d) => { const I = DA.initOf(d); return [
        { t: "List running processes: <code>ps aux</code>", re: /^ps( aux| -ef| -e)?$/ },
        { t: `Check the Bluetooth service: <code>${DA.esc(DA.fill(I.status, "bluetooth"))}</code>`, re: DA.reFrom(DA.fill(I.status, "bluetooth")) },
        { t: `Enable it: <code>${DA.esc(DA.fill(I.enable, "bluetooth"))}</code>`, re: DA.reFrom(DA.fill(I.enable, "bluetooth")) },
        { t: "Kill a stuck program: <code>pkill firefox</code>", re: /^(pkill|killall) \w+$/ }
      ]; },
      quiz: (d) => { const I = DA.initOf(d); return [
        { q: `What init system does ${d.name} use?`, a: DA.shuffleSeeded(["systemd", "OpenRC", "runit", "dinit"].includes(I.name) ? ["systemd", "OpenRC", "runit", "dinit"] : [I.name, "systemd", "OpenRC", "runit"], d.id + "i"), cAns: I.name, why: `${d.name} boots with ${I.name}.` },
        { q: "What's a PID?", a: ["A password ID", "A process's ID number", "A package format", "A network port"], c: 1, why: "Every process gets a Process ID, and kill uses it." },
        { q: "<code>kill -9</code> is…", a: ["A polite request", "A forced, can't-ignore stop", "A restart", "Fake"], c: 1, why: "Signal 9 (SIGKILL) can't be caught. Use it when a program is truly frozen." }
      ]; }
    },
    {
      id: "c7", title: "Networking basics", mins: 8, icon: "wifi",
      blurb: "IP addresses, testing connections, downloading from the terminal and SSH.",
      body: (d) => `
        <p>A few commands answer 90% of "why is my internet broken?" questions.</p>
        <ul>
          <li>${c("ip a")}: your network interfaces and IP addresses (${c("wlan0")} is usually Wi-Fi)</li>
          <li>${c("ping -c 3 archlinux.org")}: can I reach the internet?</li>
          <li>${c("nmcli device wifi list")}: nearby Wi-Fi networks (NetworkManager)</li>
          <li>${c("curl -O https://example.com/file.zip")}: download a file</li>
          <li>${c("ss -tulpn")}: which programs are listening on which ports</li>
        </ul>
        <h3>SSH: remote control</h3>
        <p>${c("ssh pi@192.168.1.20")} opens a terminal on another machine. It's how people manage servers, Raspberry Pis and home labs. To run the SSH server on ${d.name}, enable the ${c(svc(d))} service.</p>
        ${tip(`If ${c("ping 1.1.1.1")} works but ${c("ping google.com")} doesn't, your connection is fine and <b>DNS</b> is the problem.`)}`,
      cmds: () => [["ip a", "Show your IP addresses"], ["ping -c 3 archlinux.org", "Test the connection (3 pings)"], ["nmcli device wifi list", "Scan Wi-Fi"], ["curl -I https://example.com", "Fetch just the headers of a site"], ["ss -tulpn", "Listening ports"], ["ssh pi@192.168.1.20", "Log into another machine"]],
      steps: () => [
        { t: "Show your IP: <code>ip a</code>", re: /^ip (a|addr|address)( show)?$/ },
        { t: "Test the internet: <code>ping -c 3 archlinux.org</code>", re: /^ping .+/ },
        { t: "Scan Wi-Fi: <code>nmcli device wifi list</code>", re: /^nmcli (d|dev|device) wifi( list)?$/ },
        { t: "Peek at a website: <code>curl -I https://example.com</code>", re: /^curl .+/ }
      ],
      quiz: () => [
        { q: "Ping to 1.1.1.1 works but google.com fails. What's broken?", a: ["Wi-Fi card", "DNS", "Kernel", "Your keyboard"], c: 1, why: "DNS turns names into IPs. If raw IPs work, DNS is the suspect." },
        { q: "Which command shows your IP address?", a: ["ip a", "myip", "ls /ip", "ifup"], c: 0, why: "ip a (short for ip address) lists every interface." },
        { q: "SSH lets you…", a: ["Share screens", "Run a terminal on another computer securely", "Speed up Wi-Fi", "Install themes"], c: 1, why: "Secure SHell: an encrypted remote terminal." }
      ]
    },
    {
      id: "c8", title: "Your first shell script", mins: 12, icon: "code",
      blurb: "Automate boring stuff: variables, ifs, loops, and a script you actually run.",
      body: (d) => `
        <p>A shell script is a text file full of commands. Run it, and it does them all for you. The first line, the <b>shebang</b>, says which shell runs it:</p>
        <div class="cmd"><code>#!/usr/bin/env bash</code></div>
        <h3>The building blocks</h3>
        <ul>
          <li>Variables: ${c(`name="${DA.displayName() === "friend" ? "Tux" : DA.displayName()}"`)} then ${c("echo \"Hi $name\"")} (no spaces around =!)</li>
          <li>If: ${c("if [ -f notes.txt ]; then echo found; fi")}</li>
          <li>Loops: ${c("for i in 1 2 3; do echo $i; done")}</li>
          <li>Arguments: ${c("$1")} is the first thing you pass to the script</li>
        </ul>
        <h3>Running it</h3>
        <p>Save it as ${c("hi.sh")}, make it executable with ${c("chmod +x hi.sh")} and run it with ${c("./hi.sh")}. The ${c("./")} means "the one right here".</p>
        ${shellName(d) === "fish" ? tip(`${d.name} uses <b>fish</b> as its interactive shell, which has slightly different syntax. Scripts with a ${c("#!/usr/bin/env bash")} shebang still run in bash, so this lesson works the same.`, "") : ""}
        ${tip(`Make a script that updates your system and cleans up in one go: ${c(DA.pkgOf(d).update)}. Name it ${c("update.sh")} and you've built your first tool.`)}`,
      cmds: () => [["echo 'echo \"Hi $USER, welcome back!\"' > hi.sh", "Write a one-line script"], ["chmod +x hi.sh", "Make it runnable"], ["./hi.sh", "Run it"], ["name=Tux", "Set a variable"], ["echo \"Hello $name\"", "Use it"], ["for i in 1 2 3; do echo \"Lap $i\"; done", "A tiny loop"]],
      steps: () => [
        { t: "Write a script: <code>echo 'echo \"Hi $USER!\"' > hi.sh</code>", re: /^echo .+ > ?hi\.sh$/ },
        { t: "Make it executable: <code>chmod +x hi.sh</code>", re: /^chmod (\+x|u\+x|7\d\d|5\d\d) hi\.sh$/ },
        { t: "Run it: <code>./hi.sh</code>", re: /^(\.\/hi\.sh|bash hi\.sh|sh hi\.sh)$/ },
        { t: "Try a loop: <code>for i in 1 2 3; do echo $i; done</code>", re: /^for \w+ in .+; ?do .+; ?done$/ }
      ],
      quiz: () => [
        { q: "What's wrong with <code>name = \"Tux\"</code> in bash?", a: ["Nothing", "No spaces allowed around =", "Needs single quotes", "Must be uppercase"], c: 1, why: "With spaces, bash thinks 'name' is a command. Write name=\"Tux\"." },
        { q: "What does the first line <code>#!/usr/bin/env bash</code> do?", a: ["It's a comment only", "It tells the system which interpreter runs the script", "Imports libraries", "Sets permissions"], c: 1, why: "That's the shebang. It picks the interpreter." },
        { q: "Why <code>./hi.sh</code> and not just <code>hi.sh</code>?", a: ["Style", "The current folder isn't searched for commands by default", "It's faster", "Typo protection"], c: 1, why: "For safety, Linux only runs commands from folders in your PATH unless you say ./" }
      ]
    },
    {
      id: "c9", title: "Logs & troubleshooting", mins: 10, icon: "bug",
      blurb: "Be your own tech support: read logs, check disk & memory, and search like a pro.",
      body: (d) => {
        const I = DA.initOf(d);
        return `
        <p>When something breaks, Linux almost always tells you why. You just have to know where to look.</p>
        <h3>The troubleshooting checklist</h3>
        <ol>
          <li><b>Read the error.</b> Copy the exact message into a search engine.</li>
          <li><b>Check the logs:</b> ${c(I.alllogs)}${d.init === "systemd" ? ` or for one service: ${c(DA.fill(I.logs, "NetworkManager"))}` : ""}</li>
          <li><b>Kernel messages:</b> ${c("sudo dmesg | tail -30")}, for hardware, drivers and USB stuff</li>
          <li><b>Disk full?</b> ${c("df -h")}</li>
          <li><b>Out of memory?</b> ${c("free -h")}</li>
          <li><b>What hardware is this?</b> ${c("lspci")}, ${c("lsusb")}, ${c("inxi -Fz")}</li>
        </ol>
        ${tip(`When asking for help online, always include your distro (${c("cat /etc/os-release")}), what you ran, and the <b>exact</b> error. You'll get good answers 10× faster.`)}
        ${d.id === "arch" || d.family === "arch" ? tip(`Arch-family tip: the <b>Arch Wiki</b> covers nearly everything, and it's useful even for other distros.`, "") : ""}
        ${["tumbleweed", "garuda", "cachyos", "silverblue", "aeon", "bazzite", "nixos", "vanilla"].includes(d.id) ? tip(`${d.name} can roll back: ${d.id === "nixos" ? "pick an older generation in the boot menu" : ["silverblue", "bazzite"].includes(d.id) ? c("rpm-ostree rollback") : d.id === "vanilla" ? "boot the previous root from the menu" : "boot an older Btrfs snapshot from the boot menu"}. That's an undo button for the whole OS.`, "") : ""}`;
      },
      cmds: (d) => { const I = DA.initOf(d); return [[I.alllogs, "Recent warnings and errors"], ["sudo dmesg | tail -30", "Latest kernel messages"], ["df -h", "Disk space, human-readable"], ["free -h", "Memory usage"], ["lsusb", "Connected USB devices"], ["uname -r", "Kernel version"]]; },
      steps: (d) => [
        { t: "Check memory: <code>free -h</code>", re: /^free( -\w+)?$/ },
        { t: "Check disk space: <code>df -h</code>", re: /^df( -\w+)?$/ },
        { t: "Read kernel messages: <code>sudo dmesg | tail -30</code>", re: /^(sudo )?dmesg/ },
        { t: `Read the logs: <code>${DA.esc(DA.initOf(d).alllogs)}</code>`, re: /^(journalctl|less \/var\/log|dmesg|sudo svlogtail|logread)/ }
      ],
      quiz: () => [
        { q: "Your apps keep crashing and saving fails. What do you check first?", a: ["uname -r", "df -h", "lsusb", "whoami"], c: 1, why: "A full disk causes all kinds of weird failures. df -h shows free space." },
        { q: "Kernel and driver messages are in…", a: ["dmesg", "ls", "cat ~/.bashrc", "neofetch"], c: 0, why: "dmesg shows the kernel ring buffer: hardware, drivers, USB events." },
        { q: "Best way to ask for help online?", a: ["\"It doesn't work, help\"", "Distro + what you ran + the exact error", "Post a phone photo of the screen", "Wait"], c: 1, why: "Details get answers." }
      ]
    },
    {
      id: "c10", title: "Make it yours (ricing)", mins: 10, icon: "palette",
      blurb: "Themes, aliases, fastfetch and dotfiles. Make your setup look and feel like you.",
      body: (d) => `

        <h3>Terminal glow-up</h3>
        <ul>
          <li>${c("fastfetch")}: the classic system-info splash with your distro logo</li>
          <li><b>Aliases</b> are shortcuts: ${c("alias ll='ls -la'")}. Put them in ${c(rcFile(d))} to keep them.</li>
          <li><b>Prompt:</b> try <a href="https://starship.rs">Starship</a> for a pretty, fast prompt in any shell</li>

        </ul>
        <h3>Desktop glow-up</h3>
        <p>On ${d.desktop.includes("KDE") ? "KDE Plasma, right-click the desktop and choose <b>Desktop and Wallpaper</b>, or go to System Settings → Colors & Themes. Plasma lets you change almost everything" : d.desktop.includes("GNOME") ? "GNOME, install <b>Extension Manager</b> and <b>GNOME Tweaks</b>. Extensions add docks, blur, tiling and more" : "your desktop, look for Appearance or Theme settings, then try icon packs like Papirus and cursor themes like Bibata"}.</p>
        <h3>Dotfiles</h3>
        <p>Config files start with a dot (${c(".bashrc")}, ${c(".config/")}), so they're hidden. Use ${c("ls -a")} to see them. Many people keep their dotfiles in a Git repo so a new install looks the same in minutes.</p>
        ${tip(`Try a <b>tiling window manager</b> like Hyprland, Sway or i3 when you feel brave. Windows arrange themselves and you control everything with the keyboard.`)}`,
      cmds: (d) => [["fastfetch", "Show off your system"], ["alias ll='ls -la'", "Create a shortcut"], ["ll", "Use it"], ["ls -a ~", "See hidden dotfiles"], [`echo "alias ll='ls -la'" >> ${rcFile(d)}`, "Make the alias permanent"], ["fc-list | head", "Installed fonts"]],
      steps: () => [
        { t: "Flex your system: <code>fastfetch</code>", re: /^(fast|neo)fetch$/ },
        { t: "Make an alias: <code>alias ll='ls -la'</code>", re: /^alias ll[= ]['"]?ls -la?['"]?$/ },
        { t: "Use it: <code>ll</code>", re: /^ll$/ },
        { t: "Find hidden dotfiles: <code>ls -a</code>", re: /^ls -a\w*( ~)?$/ }
      ],
      quiz: () => [
        { q: "Why are config files called \"dotfiles\"?", a: ["They're tiny", "Their names start with a dot, which hides them", "They're in /dot", "Dots are cool"], c: 1, why: "Files beginning with . are hidden from a normal ls." },
        { q: "Where should a bash alias go so it survives a reboot?", a: ["/etc/hosts", "~/.bashrc", "/tmp", "Nowhere, aliases are temporary"], c: 1, why: "Your shell reads its rc file each time it starts." },
        { q: "What's a tiling window manager?", a: ["A floor tile app", "A WM that arranges windows automatically in a grid", "A screensaver", "A file manager"], c: 1, why: "Tilers like Hyprland and i3 place windows for you. Keyboard heaven." }

<script>
/* Core skills II: 10 deeper lessons shared by every distro. */
(function () {
  const tip = (t, kind = "tip") => `<div class="callout ${kind}">${DA.icon(kind === "warn" ? "alert" : "spark")}<div>${t}</div></div>`;
  const c = s => `<code>${DA.esc(s)}</code>`;
  const fw = d => ["fedora", "suse"].includes(d.family) || ["rhel", "rocky", "alma", "centos", "oracle"].includes(d.id) ? "firewalld" : "ufw";
  const adminGroup = d => d.family === "debian" ? "sudo" : "wheel";

  DA.CORE2 = [
    {
      id: "c11", tier: 2, title: "Text superpowers: grep, cut, sort, sed, awk", mins: 12, icon: "code",
      blurb: "Slice, filter and transform text like a sysadmin. This is the real Unix superpower.",
      body: () => `
        <p>Almost everything in Linux is text: configs, logs, command output. A handful of small tools, chained with pipes ${c("|")}, can answer almost any question about it.</p>
        <ul>
          <li>${c("grep -i error app.log")}: lines containing "error" (-i ignores case, -n adds line numbers, -v inverts)</li>
          <li>${c("cut -d: -f1 /etc/passwd")}: split each line on ${c(":")} and keep field 1 (every username!)</li>
          <li>${c("sort file | uniq -c")}: count how many times each line appears (uniq only merges <i>adjacent</i> duplicates, so sort first)</li>
          <li>${c("sed 's/old/new/g' file")}: find and replace (add ${c("-i")} to edit the file in place)</li>
          <li>${c("awk '{print $1}' file")}: print the first whitespace-separated column of each line</li>
        </ul>
        <h3>Chaining them</h3>
        <p>"Which IPs hit my server most?" ${c("awk '{print $1}' access.log | sort | uniq -c | sort -rn | head")}. Each tool does one small job, and pipes connect them.</p>
        ${tip(`There are two practice files in your terminal's home: ${c("Documents/fruits.txt")} and ${c("Documents/access.log")}. Experiment!`)}
        ${tip(`${c("sed -i")} edits files for real with no undo. Test without -i first, or keep a backup with ${c("sed -i.bak ...")}.`, "warn")}`,
      cmds: () => [["grep -in error Documents/access.log", "Find errors, with line numbers"], ["cut -d: -f1 /etc/passwd", "List every user account"], ["sort Documents/fruits.txt | uniq -c", "Count duplicates"], ["sed 's/apple/mango/g' Documents/fruits.txt", "Find & replace"], ["awk '{print $1}' Documents/access.log", "First column"], ["awk '{print $1}' Documents/access.log | sort | uniq -c | sort -rn", "Top visitors"]],
      steps: () => [
        { t: "Find errors: <code>grep -i error Documents/access.log</code>", re: /^grep (-\w+ )*['"]?error['"]? (~\/)?Documents\/access\.log$/ },
        { t: "List users: <code>cut -d: -f1 /etc/passwd</code>", re: /^cut -d ?['"]?:['"]? -f ?1 \/etc\/passwd$/ },
        { t: "Count fruit: <code>sort Documents/fruits.txt | uniq -c</code>", re: /^(sort (~\/)?Documents\/fruits\.txt|cat (~\/)?Documents\/fruits\.txt \| sort) \| uniq -c( \| sort -r?n)?$/ },
        { t: "Replace text: <code>sed 's/apple/mango/g' Documents/fruits.txt</code>", re: /^sed ['"]s\/[^/]+\/[^/]*\/g?['"] (~\/)?Documents\/fruits\.txt$/ },
        { t: "First column: <code>awk '{print $1}' Documents/access.log</code>", re: /^awk ['"]\{ ?print \$1 ?\}['"] (~\/)?Documents\/access\.log/ }
      ],
      quiz: () => [
        { q: "Why do you usually <code>sort</code> before <code>uniq</code>?", a: ["It's faster", "uniq only merges duplicates that are next to each other", "uniq needs uppercase", "No reason"], c: 1, why: "Sorting puts identical lines together." },
        { q: "What does <code>cut -d: -f1</code> do?", a: ["Deletes line 1", "Splits on : and keeps the first field", "Cuts files in half", "Counts colons"], c: 1, why: "-d sets the delimiter, -f picks fields." },
        { q: "Which flag makes sed change the file itself?", a: ["-n", "-i", "-e", "-x"], c: 1, why: "-i = in place. Careful!" }
      ]
    },
    {
      id: "c12", tier: 2, title: "Archives & compression", mins: 9, icon: "package",
      blurb: "tar, gzip and zip: pack, inspect and unpack like you mean it.",
      body: () => `
        <p><b>tar</b> bundles many files into one archive. Compression (gzip, xz, zstd) makes it smaller. Remember the letters:</p>
        <ul>
          <li>${c("c")} create, ${c("x")} extract, ${c("t")} list contents</li>
          <li>${c("z")} gzip (.tar.gz), ${c("J")} xz (.tar.xz), ${c("--zstd")} zstd (.tar.zst)</li>
          <li>${c("v")} verbose, and ${c("f")} file name (it must come <b>right before</b> the name)</li>
        </ul>
        <p>So: ${c("tar -czvf backup.tar.gz Documents")} creates, ${c("tar -tzf backup.tar.gz")} peeks inside, and ${c("tar -xzf backup.tar.gz -C restore")} extracts into a folder.</p>
        <p><b>zip</b> is handy for sharing with Windows/macOS users: ${c("zip -r docs.zip Documents")} and ${c("unzip -l docs.zip")}.</p>
        ${tip(`Always list (-t) an archive from the internet before extracting it, so you know where its files will land.`)}`,
      cmds: () => [["tar -czvf backup.tar.gz Documents", "Create a gzipped archive"], ["tar -tzf backup.tar.gz", "List what's inside"], ["mkdir restore && tar -xzf backup.tar.gz -C restore", "Extract into a folder"], ["zip -r docs.zip Documents", "Make a zip"], ["unzip -l docs.zip", "List a zip"]],
      steps: () => [
        { t: "Pack it: <code>tar -czvf backup.tar.gz Documents</code>", re: /^tar -?c\w*f backup\.tar\.gz (~\/)?Documents\/?$/ },
        { t: "Peek inside: <code>tar -tzf backup.tar.gz</code>", re: /^tar -?t\w*f backup\.tar\.gz$/ },
        { t: "Extract: <code>mkdir restore && tar -xzf backup.tar.gz -C restore</code>", re: /tar -?x\w*f backup\.tar\.gz( -C \S+)?$/ },
        { t: "Zip it: <code>zip -r docs.zip Documents</code>", re: /^zip -r \S+\.zip (~\/)?Documents\/?$/ }
      ],
      quiz: () => [
        { q: "Which tar letter means extract?", a: ["c", "x", "t", "z"], c: 1, why: "x = extract, c = create, t = list." },
        { q: "What's wrong with <code>tar -cfz backup.tar.gz Documents</code>?", a: ["Nothing", "f must come right before the archive name", "z isn't real", "tar needs sudo"], c: 1, why: "Here tar would treat 'z' as the file name." },
        { q: "Why list an archive before extracting it?", a: ["It's faster", "To see where its files will land", "It decrypts it", "No reason"], c: 1, why: "Some archives dump files everywhere." }
      ]
    },
    {
      id: "c13", tier: 2, title: "Users, groups & sudo rights", mins: 10, icon: "user",
      blurb: (d) => `Create accounts, manage groups and decide who gets admin power on ${d.name}.`,
      body: (d) => `
        <p>Linux is multi-user from the ground up. Each user has a UID, a home folder and belongs to groups. Groups grant access, like ${c(adminGroup(d))} (admin rights on ${d.name}), ${c("audio")} or ${c("docker")}.</p>
        <ul>
          <li>${c("sudo useradd -m alex")}: create a user with a home folder (-m). Debian-family also has the friendlier ${c("adduser")}</li>
          <li>${c("sudo passwd alex")}: set their password</li>
          <li>${c(`sudo usermod -aG ${adminGroup(d)} alex`)}: <b>a</b>ppend them to a group. Without -a you'd <i>replace</i> all their groups!</li>
          <li>${c("id alex")} and ${c("groups alex")}: check membership</li>
          <li>${c("sudo userdel -r alex")}: delete the user and their home</li>
        </ul>
        <p>Who may use sudo is defined in ${c("/etc/sudoers")}. Always edit it with ${c("sudo visudo")}, which checks for mistakes before saving.</p>
        ${tip(`Group changes apply at the next login. Log out and back in (or run ${c("newgrp groupname")}).`)}`,
      cmds: (d) => [["sudo useradd -m alex", "Create a user"], ["sudo passwd alex", "Set a password"], [`sudo usermod -aG ${adminGroup(d)} alex`, "Give admin rights"], ["id alex", "Check UID and groups"], ["sudo userdel -r alex", "Remove the user"], ["sudo visudo", "Safely edit sudoers"]],
      steps: (d) => [
        { t: "Create a user: <code>sudo useradd -m alex</code>", re: /^sudo (useradd -m|adduser) \w+$/ },
        { t: "Set a password: <code>sudo passwd alex</code>", re: /^sudo passwd \w+$/ },
        { t: `Grant admin: <code>sudo usermod -aG ${adminGroup(d)} alex</code>`, re: /^sudo usermod -a?G \w+ \w+$/ },
        { t: "Check: <code>id alex</code>", re: /^(id|groups) \w+$/ },
        { t: "Clean up: <code>sudo userdel -r alex</code>", re: /^sudo userdel( -r)? \w+$/ }
      ],
      quiz: (d) => [
        { q: "Why is the <code>-a</code> in <code>usermod -aG</code> so important?", a: ["It's not", "Without it, the user's other groups get replaced", "It adds a password", "It makes them admin"], c: 1, why: "-a appends. -G alone overwrites the supplementary group list." },
        { q: `Which group gives sudo rights on ${d.name}?`, a: DA.shuffleSeeded(["sudo", "wheel", "admin", "root"], d.id + "g"), cAns: adminGroup(d), why: `On ${d.name} it's the ${adminGroup(d)} group.` },
        { q: "How should you edit /etc/sudoers?", a: ["nano directly", "sudo visudo", "echo >>", "Never"], c: 1, why: "visudo checks syntax, so a typo can't lock you out of sudo." }
      ]
    },
    {
      id: "c14", tier: 2, title: "Disks, partitions & mounting", mins: 11, icon: "folder",
      blurb: "See your drives, mount a USB stick by hand and understand fstab.",
      body: () => `
        <p>Drives appear as device files: ${c("/dev/sda")} (SATA/USB), ${c("/dev/nvme0n1")} (NVMe) and ${c("/dev/mmcblk0")} (eMMC/SD cards). Partitions get numbers: ${c("sda1")}, ${c("nvme0n1p2")}.</p>
        <ul>
          <li>${c("lsblk -f")}: drives, partitions, filesystems and UUIDs</li>
          <li>${c("findmnt /")}: what's mounted where</li>
          <li>${c("sudo mount /dev/sdb1 /mnt")}: attach a filesystem to a folder</li>
          <li>${c("sudo umount /mnt")}: detach it safely (note: <b>umount</b>, no "n")</li>
        </ul>
        <h3>fstab: mounting at boot</h3>
        <p>${c("/etc/fstab")} lists what mounts at boot, by UUID: ${c("UUID=… /data ext4 defaults 0 2")}. Test changes with ${c("sudo mount -a")} <b>before</b> rebooting.</p>
        ${tip(`A broken fstab line can stop your system from booting. Run ${c("sudo mount -a")} after every edit, and fix any errors it shows.`, "warn")}`,
      cmds: () => [["lsblk -f", "Drives and filesystems"], ["findmnt /", "Where root is mounted"], ["sudo mount /dev/sdb1 /mnt", "Mount a USB stick"], ["df -h /mnt", "Check its space"], ["sudo umount /mnt", "Unmount safely"], ["cat /etc/fstab", "Boot-time mounts"]],
      steps: () => [
        { t: "See drives: <code>lsblk -f</code>", re: /^lsblk( -f)?$/ },
        { t: "Mount the USB stick: <code>sudo mount /dev/sdb1 /mnt</code>", re: /^sudo mount \/dev\/sdb1 \/mnt\/?$/ },
        { t: "Check its space: <code>df -h /mnt</code>", re: /^df( -h)? \/mnt\/?$/ },
        { t: "Unmount: <code>sudo umount /mnt</code>", re: /^sudo umount (\/mnt|\/dev\/sdb1)\/?$/ }
      ],
      quiz: () => [
        { q: "What does <code>nvme0n1p2</code> refer to?", a: ["A network card", "Partition 2 on the first NVMe drive", "A USB port", "RAM"], c: 1, why: "p2 = partition 2." },
        { q: "What should you run after editing /etc/fstab?", a: ["reboot immediately", "sudo mount -a to test it", "rm fstab", "Nothing"], c: 1, why: "It catches errors before they break booting." },
        { q: "How do you safely detach a mounted drive?", a: ["unmount", "umount", "eject -f /", "pull it out"], c: 1, why: "The command is umount (no 'n')." }
      ]
    },
    {
      id: "c15", tier: 2, title: "Environment variables & PATH", mins: 9, icon: "terminal",
      blurb: (d) => `How your shell finds programs, and how to make settings stick in ${DA.shellName(d)}.`,
      body: (d) => {
        const fish = DA.shellName(d) === "fish";
        return `
        <p>Environment variables are named values every program can read: ${c("$HOME")}, ${c("$USER")}, ${c("$EDITOR")}, ${c("$LANG")}… The most important is ${c("$PATH")}: the list of folders searched when you type a command.</p>
        <ul>
          <li>${c("echo $PATH")}: see it (folders separated by ${c(":")})</li>
          <li>${c("printenv")}: every variable. ${c("printenv HOME")} prints just one</li>
          <li>${c("which ls")}: where a command lives</li>
          <li>${fish ? `${c("set -gx EDITOR nano")} sets a variable in fish (${c("set -Ux")} keeps it forever)` : `${c("export EDITOR=nano")} sets a variable for this session`}</li>
        </ul>
        <h3>Your own commands</h3>
        <p>Make ${c("~/.local/bin")} and put scripts there. ${fish ? `In fish, add it to PATH once with ${c("fish_add_path ~/.local/bin")}.` : `Add ${c('export PATH="$HOME/.local/bin:$PATH"')} to ${c("~/.bashrc")} so it sticks.`}</p>
        ${tip(`Never set PATH to just your folder. Always keep ${c("$PATH")} in it, or every normal command disappears!`, "warn")}`;
      },
      cmds: (d) => [["echo $PATH", "Where commands are searched"], ["printenv HOME", "One variable"], [DA.shellName(d) === "fish" ? "set -gx EDITOR nano" : "export EDITOR=nano", "Set a variable"], ["mkdir -p ~/.local/bin", "A home for your scripts"], ["which ls", "Where ls lives"]],
      steps: (d) => [
        { t: "Look at PATH: <code>echo $PATH</code>", re: /^echo "?\$PATH"?$/ },
        { t: "One variable: <code>printenv HOME</code>", re: /^printenv \w+$/ },
        { t: DA.shellName(d) === "fish" ? "Set one: <code>set -gx EDITOR nano</code>" : "Set one: <code>export EDITOR=nano</code>", re: /^(export \w+=\S+|set -[gU]x \w+ \S+)$/ },
        { t: "Find a command: <code>which ls</code>", re: /^which \S+$/ }
      ],
      quiz: () => [
        { q: "What is <code>$PATH</code>?", a: ["Your home folder", "The list of folders searched for commands", "A file", "Your password"], c: 1, why: "When you type ls, the shell looks for it in each PATH folder." },
        { q: "What happens if you set PATH to just one folder?", a: ["Faster shell", "Normal commands like ls stop being found", "Nothing", "More disk space"], c: 1, why: "Always append or prepend, never replace." },
        { q: "Where should personal scripts go?", a: ["/usr/bin", "~/.local/bin", "/tmp", "/boot"], c: 1, why: "It's yours and needs no sudo." }
      ]
    },
    {
      id: "c16", tier: 2, title: "Scheduling: cron & timers", mins: 10, icon: "clock",
      blurb: (d) => d.init === "systemd" ? "Run tasks automatically with cron and systemd timers." : "Run tasks automatically with cron.",
      body: (d) => `
        <p><b>cron</b> runs commands on a schedule. Each crontab line has five time fields, then the command:</p>
        <div class="cmd"><code>m h dom mon dow  command
0 9 * * 1-5  ~/backup.sh   # 9:00 on weekdays</code></div>
        <ul>
          <li>${c("*")} = every, ${c("*/15")} = every 15, ${c("1-5")} = Monday to Friday</li>
          <li>${c("crontab -l")}: list your jobs. ${c("crontab -e")} edits them</li>
          <li>Quick add from the shell: ${c('echo "0 9 * * * ~/backup.sh" | crontab -')} (this <i>replaces</i> your crontab)</li>
        </ul>
        ${d.init === "systemd" ? `<h3>systemd timers</h3><p>${d.name} also has <b>systemd timers</b>: logged, catch up on missed runs, and easy to inspect with ${c("systemctl list-timers")}. Many distros use them for log rotation and updates.</p>` : ""}
        ${tip(`Not sure about the syntax? crontab.guru explains any schedule in plain English.`)}
        ${["arch", "cachyos", "endeavour", "manjaro", "garuda", "fedora"].includes(d.id) ? tip(`${d.name} may not have a cron daemon installed by default. Install ${c("cronie")} and enable its service, or use systemd timers.`, "warn") : ""}`,
      cmds: (d) => [["crontab -l", "List your jobs"], ['echo "0 9 * * * ~/backup.sh" | crontab -', "Schedule a daily 9:00 job"], ["crontab -e", "Edit jobs in your editor"], ...(d.init === "systemd" ? [["systemctl list-timers", "systemd's timers"]] : [])],
      steps: (d) => [
        { t: "Check for jobs: <code>crontab -l</code>", re: /^crontab -l$/ },
        { t: 'Add one: <code>echo "0 9 * * * ~/backup.sh" | crontab -</code>', re: /^echo ['"][^'"]*['"] \| crontab -$/ },
        { t: "Confirm it: <code>crontab -l</code>", re: /^crontab -l$/, after: 1 },
        ...(d.init === "systemd" ? [{ t: "See systemd timers: <code>systemctl list-timers</code>", re: /^systemctl list-timers( --all)?$/ }] : [])
      ],
      quiz: () => [
        { q: "What does <code>*/15 * * * *</code> mean?", a: ["15th of each month", "Every 15 minutes", "At 3pm", "Never"], c: 1, why: "*/15 in the minute field = every 15 minutes." },
        { q: "What does <code>0 9 * * 1-5</code> mean?", a: ["9:00 every weekday", "Every 9 minutes", "9 May", "Weekends at 9"], c: 0, why: "Minute 0, hour 9, any day, any month, Monday to Friday." },
        { q: "<code>echo \"…\" | crontab -</code> does what to existing jobs?", a: ["Keeps them", "Replaces them all", "Doubles them", "Emails them"], c: 1, why: "It installs exactly what you pipe in." }
      ]
    },
    {
      id: "c17", tier: 2, title: "SSH keys: passwordless & secure", mins: 10, icon: "lock",
      blurb: "Generate a key pair, copy it to a server and log in without passwords.",
      body: () => `
        <p>An SSH key pair is a <b>private key</b> (stays on your computer, secret!) and a <b>public key</b> (safe to share). Servers that trust your public key let you in without a password.</p>
        <ol>
          <li>${c('ssh-keygen -t ed25519 -C "laptop"')}: creates ${c("~/.ssh/id_ed25519")} and ${c("id_ed25519.pub")}. Add a passphrase for extra safety.</li>
          <li>${c("ssh-copy-id pi@192.168.1.50")}: installs your public key on the server</li>
          <li>${c("ssh pi@192.168.1.50")}: log in with your key</li>
        </ol>

(function () {
  const tip = (t, kind = "tip") => `<div class="callout ${kind}">${DA.icon(kind === "warn" ? "alert" : "spark")}<div>${t}</div></div>`;

      id: "bash1", title: "Your first script", mins: 8, icon: "file",
      blurb: "A file full of commands that runs with one word. This is where automation starts.",
      body: () => `
        <p>A <b>script</b> is just a text file of commands. Instead of typing five commands every morning, you write them once and run the file.</p>
        ${pre("#!/bin/bash\necho \"Hello, $USER!\"\necho \"Today is $(date +%F)\"")}
        <ul><li>Line 1, the <b>shebang</b> (${c("#!/bin/bash")}), tells Linux which program runs the file.</li>
        <li>${c("chmod +x hello.sh")} makes it executable. Without it you get <i>Permission denied</i>.</li>
        <li>Run it with ${c("./hello.sh")}. The ${c("./")} means "the one in this folder".</li></ul>
        ${tip(`Writing longer scripts? ${c("nano hello.sh")} opens a real editor right here. ^O saves, ^X exits.`)}`,
      cmds: () => [["nano hello.sh", "Write a script in an editor"], ["chmod +x hello.sh", "Make it executable"], ["./hello.sh", "Run it"], ["bash -n hello.sh", "Check it for syntax errors without running it"]],
      steps: () => [
        { t: "Start the script: <code>echo '#!/bin/bash' > hello.sh</code>", re: /^echo ['"]#!\/bin\/(ba)?sh['"] > ?hello\.sh$/ },
        { t: "Add a line: <code>echo 'echo \"Hello, $USER!\"' >> hello.sh</code>", re: /^echo .+ >> ?hello\.sh$/ },
        { t: "Make it executable: <code>chmod +x hello.sh</code>", re: /^chmod (\+x|u\+x|a\+x|7[0-7][0-7]) hello\.sh$/ },
        { t: "Run it: <code>./hello.sh</code>", re: /^(\.\/hello\.sh|bash hello\.sh)$/ }
      ],
      quiz: [
        { q: "What does the first line <code>#!/bin/bash</code> do?", a: ["Tells Linux which program should run the script", "It's a comment that does nothing", "Makes the file executable", "Deletes old versions"], c: 0, why: "The shebang picks the interpreter. Without it, your current shell guesses." },
        { q: "You run <code>./backup.sh</code> and get <i>Permission denied</i>. What's the fix?", a: ["chmod +x backup.sh", "sudo rm backup.sh", "Rename it to .exe", "Reboot"], c: 0, why: "Scripts need the execute (x) permission." }
      ]
    },
    {
      id: "bash2", title: "Variables and quotes", mins: 9, icon: "code",
      blurb: "Store values, reuse them, and learn why quotes matter so much.",
      body: () => `
        <p>Set a variable with ${c('name="Tux"')} (<b>no spaces</b> around ${c("=")}!) and use it with ${c("$name")}.</p>
        <ul><li><b>Double quotes</b> expand variables: ${c('echo "Hi $name"')} prints <i>Hi Tux</i>.</li>
        <li><b>Single quotes</b> keep everything literal: ${c("echo 'Hi $name'")} prints <i>Hi $name</i>.</li>
        <li><b>Command substitution</b> stores a command's output: ${c("today=$(date +%F)")}</li>
        <li>Defaults: ${c('${1:-Documents}')} means "the first argument, or Documents if there isn't one".</li></ul>
        ${tip(`Always quote variables that hold file names: ${c('rm "$file"')}. A file called "my notes.txt" would otherwise become two arguments.`, "warn")}`,
      cmds: () => [['name="Tux"', "Set a variable"], ['echo "Hello, $name"', "Use it"], ["today=$(date +%F)", "Store a command's output"], ['echo "${#name} letters"', "Length of a variable"]],
      steps: () => [
        { t: "Set a variable: <code>name=\"Tux\"</code>", re: /^name=["']?\w+["']?$/ },
        { t: "Use it in double quotes: <code>echo \"Hello, $name\"</code>", re: /^echo "[^"]*\$\{?name\}?[^"]*"$/ },
        { t: "See single quotes stay literal: <code>echo 'Hello, $name'</code>", re: /^echo '[^']*\$name[^']*'$/ },
        { t: "Store a command's output: <code>today=$(date +%F)</code> then <code>echo \"Today is $today\"</code>", re: /^today=\$\(date( \+%F)?\)$/ }
      ],
      quiz: [
        { q: "What does <code>echo 'Cost: $price'</code> print?", a: ["Cost: $price", "The value of price", "Nothing", "An error"], c: 0, why: "Single quotes are literal: no expansion." },
        { q: "Which assignment is correct?", a: ['name="Tux"', 'name = "Tux"', '$name="Tux"', 'set name Tux'], c: 0, why: "No spaces around = in Bash." }
      ]
    },
    {
      id: "bash3", title: "Arguments: talking to your script", mins: 8, icon: "terminal",
      blurb: "$1, $2, $# and $@: how scripts receive what you type after them.",
      body: () => `
        <p>Words after a script's name become <b>arguments</b>: ${c("./greet.sh Ethan Tux")}.</p>
        <ul><li>${c("$1")}, ${c("$2")}…: the first, second… argument</li><li>${c("$#")}: how many there are</li><li>${c('"$@"')}: all of them, each kept whole (perfect for loops)</li><li>${c("$0")}: the script's own name</li></ul>
        ${pre('#!/bin/bash\necho "Hi $1, you gave me $# arguments"\nfor person in "$@"; do\n  echo "Welcome, $person"\ndone')}`,
      cmds: () => [["./greet.sh Ethan", "One argument"], ["./greet.sh Ethan Tux Larry", "Three"], ['echo "$#"', "How many arguments"]],
      steps: () => [

        { t: "Run it with one argument: <code>./greet.sh Ethan</code>", re: /^(\.\/|bash )greet\.sh \S+$/ },

      quiz: [

        { q: "What does <code>$#</code> hold?", a: ["The number of arguments", "The last argument", "The script's name", "A comment"], c: 0, why: "$# counts the arguments." }
      ]
    },
    {
      id: "bash4", title: "Decisions: if, test and exit codes", mins: 10, icon: "target",
      blurb: "Make scripts react: does the file exist? Is the number big? Did that command work?",
      body: () => `
        <p>Every command finishes with an <b>exit code</b>: ${c("0")} means success, anything else means failure. ${c("echo $?")} shows the last one.</p>
        ${pre('if [ -f notes.txt ]; then\n  echo "found it"\nelif [ -d notes ]; then\n  echo "it\'s a folder"\nelse\n  echo "nothing there"\nfi')}
        <ul><li>Files: ${c("-f")} file exists, ${c("-d")} folder exists, ${c("-x")} is executable</li>

        <li>Numbers: ${c("-eq -ne -lt -le -gt -ge")}, as in ${c('[ "$n" -gt 5 ]')}</li>
        <li>Shortcuts: ${c("cmd && echo worked")}, ${c("cmd || echo failed")}</li></ul>
        ${tip(`The spaces inside ${c("[ ]")} are required: ${c("[ -f x ]")}, never ${c("[-f x]")}.`, "warn")}`,
      cmds: () => [["if [ -d Documents ]; then echo yes; fi", "Is there a Documents folder?"], ["grep -q apple Documents/fruits.txt; echo $?", "Exit code of a search"], ["[ -f nope.txt ] || echo missing", "Run something only if a test fails"]],
      steps: () => [

        { t: "See an exit code: <code>grep -q apple Documents/fruits.txt; echo $?</code>", re: /^grep -q \S+ \S+; echo \$\?$/ },
        { t: "Use || for failures: <code>[ -f nope.txt ] || echo \"no such file\"</code>", re: /^\[ -[fde] \S+ \] \|\| echo .+$/ },
        { t: "Compare numbers: <code>x=7; if [ $x -gt 5 ]; then echo big; else echo small; fi</code>", re: /^x=\d+; if \[ \$x -(gt|lt|ge|le|eq|ne) \d+ \]; then echo .+; else echo .+; fi$/ }

      quiz: [
        { q: "What exit code means success?", a: ["0", "1", "255", "-1"], c: 0, why: "Zero is success; anything else is a kind of failure." },

      blurb: "for, while and reading files line by line.",
      body: () => `

        <li>Until something changes: ${c("while [ $n -gt 0 ]; do …; n=$((n-1)); done")}</li>
        <li>Every line of a file: ${c('while read line; do echo "$line"; done < todo.txt')}</li>

        ${tip(`A while loop whose condition never becomes false runs forever. Ctrl+C stops it in a real terminal (the practice one stops after 1000 rounds).`, "warn")}`,
      cmds: () => [["for i in {1..5}; do echo round $i; done", "Count to 5"], ["for f in Documents/*; do echo file: $f; done", "Every file in a folder"], ["while read line; do echo todo: $line; done < Documents/todo.txt", "Each line of a file"]],
      steps: () => [

        { t: "Loop over files: <code>for f in Documents/*; do echo \"file: $f\"; done</code>", re: /^for \w+ in \S*\*\S*; do .+; done$/ },
        { t: "Count down: <code>n=3; while [ $n -gt 0 ]; do echo $n; n=$((n-1)); done; echo liftoff</code>", re: /^n=\d+; while \[ \$n -gt 0 \]; do .+; done(; .+)?$/ },
        { t: "Read a file: <code>while read line; do echo \"todo: $line\"; done < Documents/todo.txt</code>", re: /^while read \w+; do .+; done < ?\S+$/ }

      quiz: [

      ]

      body: () => `

        <ul><li>Inside a function, ${c("$1")}, ${c("$2")}… are the <i>function's</i> arguments.</li><li>${c("local")} keeps a variable inside the function.</li><li>${c("return 1")} ends it with an exit code, just like a command.</li></ul>

      ],
      quiz: [

        ${tip(`Need decimals? Bash only does whole numbers. Use ${c("awk 'BEGIN{print 17/5}'")} or ${c("bc")}.`)}`,
      cmds: () => [["echo $(( 17 / 5 )) $(( 17 % 5 ))", "Division and remainder"], ["bash -c 'exit 3'; echo $?", "See a custom exit code"], ["mkdir test && echo created || echo failed", "Success and failure paths"]],
      steps: () => [
        { t: "Do some math: <code>echo $(( 17 / 5 )) $(( 17 % 5 ))</code>", re: /^echo .*\$\(\(.+\)\).*$/ },
        { t: "Set an exit code: <code>bash -c 'exit 3'; echo $?</code>", re: /^bash -c ['"]exit \d+['"]; echo \$\?$/ },
        { t: "Branch on success: <code>mkdir test && echo created || echo failed</code>", re: /^mkdir \S+ && echo .+ \|\| echo .+$/ }
      ],
      quiz: [
        { q: "What is <code>$(( 17 % 5 ))</code>?", a: ["2", "3", "3.4", "17"], c: 0, why: "% is the remainder: 17 = 3×5 + 2." },
        { q: "Why should scripts end with a meaningful exit code?", a: ["So other commands and scripts can tell whether they worked", "It makes them faster", "It's required to run", "It deletes temp files"], c: 0, why: "&&, || and if all rely on exit codes." }
      ]
    },
    {
      id: "bash8", title: "Project: a real backup script", mins: 14, icon: "trophy",
      blurb: "Put it all together: arguments, checks, a date-stamped archive and a clear report.",
      body: () => `
        <p>Here's a backup script a real sysadmin would be happy with. Type it into ${c("nano backup.sh")}:</p>
        ${pre('#!/bin/bash\n# Back up a folder into ~/backups with today\'s date in the name.\nsrc=${1:-Documents}\ndest=~/backups\n\nif [ ! -d "$src" ]; then\n  echo "error: $src is not a folder"\n  exit 1\nfi\n\nmkdir -p "$dest"\nname="$dest/$(basename "$src")-$(date +%F).tar.gz"\ntar -czf "$name" "$src"\necho "backed up $src to $name"\nexit 0')}
        <ul><li>${c("src=${1:-Documents}")}: use the first argument, or Documents</li><li>${c('[ ! -d "$src" ]')}: stop with an error if it isn't a folder</li><li>${c("$(date +%F)")} puts today's date in the file name, so backups never overwrite each other</li></ul>
        ${tip(`Larry never made backups. You just wrote a backup script. 💀 Pair it with the cron lesson to run it every night.`)}`,
      cmds: () => [["nano backup.sh", "Write the script"], ["chmod +x backup.sh", "Make it executable"], ["./backup.sh Documents", "Back up Documents"], ["./backup.sh nope", "See the error path"], ["ls ~/backups", "Check the result"]],
      steps: () => [
        { t: "Write the script: <code>nano backup.sh</code> (type it in, ^O to save, ^X to exit)", re: /^(nano|vi|vim) backup\.sh$/ },
        { t: "Check the syntax: <code>bash -n backup.sh</code>", re: /^bash -n backup\.sh$/ },
        { t: "Make it executable: <code>chmod +x backup.sh</code>", re: /^chmod (\+x|u\+x|a\+x|7[0-7][0-7]) backup\.sh$/ },
        { t: "Run it: <code>./backup.sh Documents</code>", re: /^(\.\/|bash )backup\.sh( \S+)?$/ },
        { t: "Check the archive: <code>ls ~/backups</code>", re: /^ls( -\w+)? (~\/|\/home\/\w+\/)?backups\/?$/ }
      ],
      quiz: [
        { q: "Why put <code>$(date +%F)</code> in the backup's file name?", a: ["So each day's backup gets a new name instead of overwriting the last", "To make it compress better", "Because tar requires it", "To hide it"], c: 0, why: "A date stamp keeps a history of backups." },
        { q: "What does <code>exit 1</code> after the error message tell other programs?", a: ["The script failed", "The script worked", "Retry once", "Nothing"], c: 0, why: "A non-zero exit code means failure." }
      ]
    }
  ];
})();
